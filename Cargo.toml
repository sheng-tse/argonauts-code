[workspace]
members = [
    "crates/adapters/acp",
    "crates/adapters/antigravity-cli",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/adapters/manifest",
    "crates/adapters/opencode",
    "crates/app",
    "crates/cli",
    "crates/conductor",
    "crates/core",
    "crates/crew",
    "crates/endpoints",
    "crates/learning",
    "crates/mcp",
    "crates/policy",
    "crates/registry",
    "crates/runner",
    "crates/scenarios",
    "crates/testkit",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
repository = "https://github.com/sheng-tse/argonauts-code"
homepage = "https://github.com/sheng-tse/argonauts-code"

[workspace.dependencies]
argonauts-core = { path = "crates/core", version = "0.0.1" }
argonauts-adapter-claude-code = { path = "crates/adapters/claude-code", version = "0.0.1" }
argonauts-adapter-codex = { path = "crates/adapters/codex", version = "0.0.1" }
argonauts-adapter-antigravity-cli = { path = "crates/adapters/antigravity-cli", version = "0.0.1" }
argonauts-conductor = { path = "crates/conductor", version = "0.0.1" }
argonauts-tui = { path = "crates/tui", version = "0.0.1" }
argonauts-app = { path = "crates/app", version = "0.0.1" }
argonauts-crew = { path = "crates/crew", version = "0.0.1" }
argonauts-policy = { path = "crates/policy", version = "0.0.1" }
argonauts-mcp = { path = "crates/mcp", version = "0.0.1" }
argonauts-registry = { path = "crates/registry", version = "0.0.1" }
argonauts-endpoints = { path = "crates/endpoints", version = "0.0.1" }
argonauts-learning = { path = "crates/learning", version = "0.0.1" }
argonauts-adapter-opencode = { path = "crates/adapters/opencode", version = "0.0.1" }
argonauts-adapter-manifest = { path = "crates/adapters/manifest", version = "0.0.1" }
argonauts-adapter-acp = { path = "crates/adapters/acp", version = "0.0.1" }
argonauts-testkit = { path = "crates/testkit", version = "0.0.1" }
argonauts-runner = { path = "crates/runner", version = "0.0.1" }

anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures = "0.3.34"
globset = "0.4.20"
insta = "1.48.0"
jsonschema = { version = "0.58.2", default-features = false }
landlock = "0.4.7"
nix = { version = "0.31.3", features = ["signal", "process"] }
portable-pty = "0.9.0"
pulldown-cmark = "0.13.4"
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
# QuickJS, built from its bundled C source: no system library, and a real memory cap and
# interrupt hook, which the workflow sandbox needs.
rquickjs = "0.14.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Workflow files are YAML.
serde-saphyr = "1.3.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
signal-hook = "0.3.18"
similar = "3.2.0"
# The Starlark parser alone. The `starlark` crate itself turns on serde_json's
# `arbitrary_precision` for the whole workspace, which breaks numbers in flattened and untagged
# types, so workflow scripts are evaluated by our own small interpreter instead.
starlark_syntax = "0.14.2"
strip-ansi-escapes = "0.2.1"
syntect = "5.3.0"
sysinfo = "0.39.6"
tempfile = "3.27.0"
textwrap = "0.16.4"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.23.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = "0.5.1"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
vt100 = "0.16.2"
which = "8.0.6"

# Link-time optimisation stays at its default: thin made the binary no smaller, and fat cut
# it by 18% but took a clean build from 2 minutes to 9.
[profile.release]
strip = true

# Tests spend most of their time in these when they're built without optimization: syntax
# highlighting and its packed syntax sets, regex engines, JSON schema checks, snapshot diffs,
# and the terminal emulator the pty tests read the screen through.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.two-face]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.jsonschema]
opt-level = 3
[profile.dev.package.referencing]
opt-level = 3
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.vt100]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
