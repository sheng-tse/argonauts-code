[workspace]
members = [
    "crates/adapters/acp",
    "crates/adapters/antigravity-cli",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/adapters/manifest",
    "crates/adapters/opencode",
    "crates/app",
    "crates/cli",
    "crates/conductor",
    "crates/core",
    "crates/crew",
    "crates/endpoints",
    "crates/learning",
    "crates/mcp",
    "crates/policy",
    "crates/registry",
    "crates/runner",
    "crates/scenarios",
    "crates/testkit",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/sheng-tse/argonauts-code"
homepage = "https://github.com/sheng-tse/argonauts-code"
keywords = ["ai", "agents", "llm", "coding", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# Every dependency is named here once, with every feature any member needs, and members say only
# `workspace = true`. A feature one member adds would build the dependency one way when that
# member is in a build and another way when it isn't, and rebuild everything above it.
[workspace.dependencies]
argonauts-core = { path = "crates/core", version = "0.2.1" }
argonauts-adapter-claude-code = { path = "crates/adapters/claude-code", version = "0.2.1" }
argonauts-adapter-codex = { path = "crates/adapters/codex", version = "0.2.1" }
argonauts-adapter-antigravity-cli = { path = "crates/adapters/antigravity-cli", version = "0.2.1" }
argonauts-conductor = { path = "crates/conductor", version = "0.2.1" }
argonauts-tui = { path = "crates/tui", version = "0.2.1" }
argonauts-app = { path = "crates/app", version = "0.2.1" }
argonauts-crew = { path = "crates/crew", version = "0.2.1" }
argonauts-policy = { path = "crates/policy", version = "0.2.1" }
argonauts-mcp = { path = "crates/mcp", version = "0.2.1" }
argonauts-registry = { path = "crates/registry", version = "0.2.1" }
argonauts-endpoints = { path = "crates/endpoints", version = "0.2.1" }
argonauts-learning = { path = "crates/learning", version = "0.2.1" }
argonauts-adapter-opencode = { path = "crates/adapters/opencode", version = "0.2.1" }
argonauts-adapter-manifest = { path = "crates/adapters/manifest", version = "0.2.1" }
argonauts-adapter-acp = { path = "crates/adapters/acp", version = "0.2.1" }
# No version: a dev-dependency without one is left out of the published packages.
argonauts-testkit = { path = "crates/testkit" }
argonauts-runner = { path = "crates/runner", version = "0.2.1" }

agent-client-protocol = "2.2.0"
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
globset = "0.4.20"
insta = "1.48.0"
jsonschema = { version = "0.58.2", default-features = false }
landlock = "0.4.7"
minisign = "0.7"
minisign-verify = "0.2"
nix = { version = "0.31.3", features = ["event", "fs", "mount", "poll", "process", "sched", "signal", "socket", "term", "uio", "user"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.5.0", features = ["client", "server", "transport-io"] }
# QuickJS, built from its bundled C source: no system library, and a real memory cap and
# interrupt hook, which the workflow sandbox needs.
rquickjs = "0.14.0"
schemars = "1.2.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Objects keep the order their keys were written in, so an answer format lists a type's fields
# as it declares them.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Workflow files are YAML.
serde-saphyr = "1.3.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
signal-hook = "0.3.18"
similar = { version = "3.2.0", features = ["inline"] }
# The Starlark parser alone. The `starlark` crate itself turns on serde_json's
# `arbitrary_precision` for the whole workspace, which breaks numbers in flattened and untagged
# types, so workflow scripts are evaluated by our own small interpreter instead.
starlark_syntax = "0.14.2"
strip-ansi-escapes = "0.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
sysinfo = "0.39.6"
tar = "0.4.46"
tempfile = "3.27.0"
textwrap = "0.16.4"
thiserror = "2.0.21"
# Its PNG support stays off, since the tui's own encoder writes the pictures.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.6"
toml_edit = "0.23.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
vt100 = "0.16.2"
vte = "0.15"
which = "8.0.6"
xz2 = "0.1.7"

# Link-time optimisation stays at its default: thin made the binary no smaller, and fat cut
# it by 18% but took a clean build from 2 minutes to 9.
[profile.release]
strip = true

# Debug info is line tables alone, enough for a backtrace's files and lines, and builds aren't
# incremental: full debug info and incremental folders are what filled the disk. The
# environment still overrides both, as `CARGO_INCREMENTAL=1` does for a local trial.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Tests spend most of their time in these when they're built without optimization: syntax
# highlighting and its packed syntax sets, regex engines, JSON schema checks, snapshot diffs,
# the terminal emulator the pty tests read the screen through, and the world's drawing.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.two-face]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.jsonschema]
opt-level = 3
[profile.dev.package.referencing]
opt-level = 3
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.vt100]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
