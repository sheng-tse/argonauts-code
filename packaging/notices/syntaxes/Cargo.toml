# Prints the licenses of the syntax definitions two-face bundles, for THIRD_PARTY_NOTICES.md. A tool of its own,
# outside the workspace, so the program never carries the listing. The version must match Cargo.lock's two-face;
# generate.sh checks.
[package]
name = "argonauts-syntax-notices"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[workspace]
