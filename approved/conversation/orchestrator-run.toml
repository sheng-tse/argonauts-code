# Each GPT-6 Luna review accepts, with the checks' result it was given.
[[rule]]
argv0 = "codex"
args_contain = ["exec"]
prompt_contains = "Review the task's change in the input."
stdin_prompt = "all"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"thread-review"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"verdict\":\"approve\",\"summary\":\"\",\"comments\":[],\"tamper_suspected\":false}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":12000,"cached_input_tokens":0,"output_tokens":60,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0

# Codex lists its models, so the registry knows GPT-6 Luna and the reviewers' rows name it.
[[rule]]
argv0 = "codex"
args_contain = ["debug", "models"]
[[rule.step]]
emit = '{"models":[{"slug":"gpt-6-luna","display_name":"GPT-6 Luna","description":"Fast and cheap","priority":1,"visibility":"list","max_context_window":872000,"default_reasoning_level":"low","supported_reasoning_levels":[{"effort":"low"},{"effort":"medium"}]}]}'
