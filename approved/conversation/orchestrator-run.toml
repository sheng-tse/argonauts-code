# The Orchestrator run "Add due dates", as conversation/orchestrator-run draws it: the plan on
# Opus 5.5 with 2 tool uses at 54.6k, two builds on Haiku 5.5 with 6 and 9 tool uses at 30.3k and
# 22.4k, and GPT-6 Luna reviews that accept. These rules come before the default fake agents'.

# The orchestrator plans two tasks, each with its builder and a GPT-6 Luna reviewer.
[[rule]]
argv0 = "claude"
prompt_contains = '"assignments"'
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-orchestrate","cwd":".","tools":["Read","Grep","Glob","Edit","Write","Bash"],"model":"claude-opus-5-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-orchestrate","message":{"id":"msg-sess-orchestrate-0","content":[{"type":"tool_use","id":"tu-sess-orchestrate-0","name":"Read","input":{"file_path":"todo.py"}}]}}'
[[rule.step]]
emit = '{"type":"user","parent_tool_use_id":null,"session_id":"sess-orchestrate","message":{"content":[{"type":"tool_result","tool_use_id":"tu-sess-orchestrate-0","content":"ok"}]}}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-orchestrate","message":{"id":"msg-sess-orchestrate-1","content":[{"type":"tool_use","id":"tu-sess-orchestrate-1","name":"Grep","input":{"pattern":"argparse"}}]}}'
[[rule.step]]
emit = '{"type":"user","parent_tool_use_id":null,"session_id":"sess-orchestrate","message":{"content":[{"type":"tool_result","tool_use_id":"tu-sess-orchestrate-1","content":"ok"}]}}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-orchestrate","message":{"id":"msg-sess-orchestrate-2","content":[{"type":"text","text":"Two tasks: the tests for --due, then the flag."}],"usage":{"input_tokens":54000,"output_tokens":600}}}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-orchestrate","result":"done","total_cost_usd":0.001,"usage":{"input_tokens":54000,"output_tokens":600},"modelUsage":{"claude-opus-5-5":{"contextWindow":1000000}},"structured_output":{"plan":{"summary":"Two tasks: the tests for --due, then the flag.","approach":"Write the tests, and add the flag beside them.","pieces":[{"name":"tests","description":"Tests for --due","paths":["tests/test_due.py"],"interfaces":[],"depends_on":[]},{"name":"flag","description":"The --due flag","paths":["todo.py"],"interfaces":[],"depends_on":[]}],"choices":[],"risks":[],"test_strategy":"Unit tests for --due.","new_dependencies":[]},"tasks":[{"key":"due-tests","title":"test --due","task":"Write the tests for the --due flag in tests/test_due.py.","kind":"build","owned_paths":["tests/test_due.py"],"read_only_paths":[],"depends_on":[],"criteria":[]},{"key":"due-flag","title":"add the --due flag","task":"Add the --due flag to todo.py.","kind":"build","owned_paths":["todo.py"],"read_only_paths":[],"depends_on":[],"criteria":[]}],"assignments":[{"task":"due-tests","worker":"claude-code/haiku","reviewers":["codex/gpt-6-luna"]},{"task":"due-flag","worker":"claude-code/haiku","reviewers":["codex/gpt-6-luna"]}]}}'
[[rule.step]]
exit = 0

