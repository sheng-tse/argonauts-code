# Set up with Council, every approval on Autopilot and vim keys. agents.json holds each CLI's
# plan usage as read at a time still to come, so the app never asks the fake CLIs to read it
# again; Claude Code's 5-hour window is 92% used and resets at 4:40pm on the drawings' day.
workflow = "council"

[crew]
main = "claude-code"
worker = ["claude-code", "codex", "antigravity-cli", "opencode"]
reviewer = ["claude-code", "codex", "antigravity-cli", "opencode"]
judge = ["claude-code", "codex", "antigravity-cli", "opencode"]
[approvals]
autopilot = true

[ui]
keys = "vim"
