# The approved drawings: how each screen must look, cell for cell, at the terminal size its file
# names (`<panel>/<state>@<cols>x<rows>.txt`), exported from the approved pictures.
#
# A drawing's file reads, line by line: what it shows; `screen <cols>x<rows>`; `at <row>,<col>`,
# where its first cell sits on that screen from 0, `?` where the test finds it by its text;
# `size <cols>x<rows>`, its own cells; `terminal fg=#rrggbb bg=#rrggbb`, the terminal's own
# colours; `text` and a row of characters for each of its rows, one a cell, U+FFFC where a logo
# or picture covers one; `paint` and a row of keys, one a cell; then `key` and what each key
# paints: `fg=`, `bg=`, `bold`, `italic`, `logo=<name>` or `picture=<name>`, `.` for a blank on
# the terminal's background and `?` for a cell whose character alone is compared. A row may stop
# early, its last cells blanks. `crates/testkit/src/approved.rs` says more and compares screens
# with drawings; `crates/scenarios/tests/it/app_drawings.rs` brings the real app to each
# drawing's screen and compares the two.
#
# Each drawing is listed once:
#
#   [[drawing]]
#   file = "limits/now@120x38.txt"   # its path in this folder
#   release = "0.2.0"                # the release it was approved for
#   approval = 360                   # the number of the approval that settled it
#   hash = "sha256:…"                # of the file, so a drawing never changes unseen
#   home = "homes/council"           # optional: argonauts/ goes into ARGONAUTS_HOME, home/ into HOME;
#                                    # a home with argonauts/config.toml is set up, so no setup asks
#   clis = "conversation/alone.toml" # optional: fake CLI rules for the drawing's requests,
#                                    # placed before the default fake agents' rules
#   folder = "code/shop"             # optional: the project's folder under HOME, as the header
#                                    # names it after ~/ (github/argonauts-code unless named)
#   held_by = "crates/tui/src/…_tests.rs::draws_it"
#                                    # optional: the test that holds the drawing's cells, for a
#                                    # screen whose figures the fake CLIs can't give; the app is
#                                    # then only brought to the screen
#   steps = [                        # what brings the app from its start to the screen; a drawing
#                                    # needs steps, a holding test, or both
#     { wait = "shift\\+tab to cycle" },  # a regex the visible rows match; after it the
#                                    # runner waits out a new question's first moment
#     { press = "Esc" },             # a key: Enter, Esc, Tab, Shift+Tab, Up, Ctrl+c, j, …
#     { send = "/usage\r" },         # text typed, \r for Enter
#   ]
#
# A screen draws a drawing's cells otherwise only where a departure allows it:
#
#   [[departure]]
#   file = "limits/now@120x38.txt"
#   row = 5                          # the drawing's own row, counted from its first, as a
#                                    # report counts them
#   cols = [10, 14]                  # its first and last columns, both included
#   instead = "what the screen draws there instead, and why"
#   approval = 361                   # the approval that allows it
#
# `cargo test -p argonauts-testkit approved` checks that every drawing here is listed, reads and
# still has its hash.

