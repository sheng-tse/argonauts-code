# agy still loading: the session starts and says nothing, as context/agy-loading draws it.
# agy reads its prompt from the first line on stdin. These rules come before the default fake
# agents'.

[[rule]]
argv0 = "agy"
prompt_contains = 'Look at the README'
stdin_prompt = "line"
[[rule.step]]
hang = true

# The main agent answers one question in two steps, as context/agy counts it. agy names 60
# tools as it starts. Its first step's 8,672 tokens in are its own prompt and tools (4,226),
# the project's AGENTS.md (1,200) and what Argonauts Code sends (3,246); the last step puts
# 38,900 tokens in the context, 38k in the 1,024s agy's 1M window is counted in.
[[rule]]
argv0 = "agy"
args_contain = ["--output-format"]
prompt_contains = 'What does this repo hold'
stdin_prompt = "line"
[[rule.step]]
emit = '{"event":"init","conversation_id":"conv-context-agy","init":{"model":"gemini-3.8-flash-low","cwd":".","tools":["tool_01","tool_02","tool_03","tool_04","tool_05","tool_06","tool_07","tool_08","tool_09","tool_10","tool_11","tool_12","tool_13","tool_14","tool_15","tool_16","tool_17","tool_18","tool_19","tool_20","tool_21","tool_22","tool_23","tool_24","tool_25","tool_26","tool_27","tool_28","tool_29","tool_30","tool_31","tool_32","tool_33","tool_34","tool_35","tool_36","tool_37","tool_38","tool_39","tool_40","tool_41","tool_42","tool_43","tool_44","tool_45","tool_46","tool_47","tool_48","tool_49","tool_50","tool_51","tool_52","tool_53","tool_54","tool_55","tool_56","tool_57","tool_58","tool_59","tool_60"]}}'
[[rule.step]]
emit = '{"event":"step_update","step_update":{"conversation_id":"conv-context-agy","step_index":1,"state":"DONE","step_type":"agent_response","usage":{"input_tokens":8672,"output_tokens":300,"thinking_tokens":0,"cache_read_tokens":0,"total_tokens":8928}}}'
[[rule.step]]
emit = '{"event":"step_update","step_update":{"conversation_id":"conv-context-agy","step_index":2,"state":"DONE","step_type":"agent_response","usage":{"input_tokens":38500,"output_tokens":400,"thinking_tokens":0,"cache_read_tokens":0,"total_tokens":38900}}}'
[[rule.step]]
emit = '{"event":"result","result":{"conversation_id":"conv-context-agy","status":"SUCCESS","response":"{\"kind\":\"answer\",\"answer_markdown\":\"It holds a README and an AGENTS.md.\",\"estimate\":null}","duration_seconds":1.0,"num_turns":2,"usage":{"input_tokens":47172,"output_tokens":700,"thinking_tokens":0,"cache_read_tokens":0,"total_tokens":47828}}}'
[[rule.step]]
exit = 0
