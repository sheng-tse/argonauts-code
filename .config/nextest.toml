# cargo-nextest runs each test in a process of its own. CI's shards run
# `cargo nextest run --profile ci`, and doctests, which nextest leaves out, through
# `cargo test --doc`. `.github/scripts/junit_report.py` reads the JUnit report each profile
# writes under target/nextest/<profile>/.

[profile.default]
# A test that hangs is stopped after 15 minutes instead of running on.
slow-timeout = { period = "60s", terminate-after = 15 }

# The drawings runner times each frame against the app's keys, so it runs with nothing beside
# it, wherever nextest runs it.
[[profile.default.overrides]]
filter = "test(=app_drawings::every_drawing_matches_the_app)"
threads-required = "num-test-threads"

[profile.ci]
# A test that fails is tried twice more. One that passes on a retry passes the run, and the
# job's summary and annotations name it as flaky, so it is never hidden.
retries = 2
fail-fast = false
failure-output = "immediate-final"
# A test that hangs is stopped after 13 minutes: past a scenario's longest wait, three minutes,
# at the macOS runners' deadline scale of 4, and short enough that all three tries of it still
# fit in the test job's time.
slow-timeout = { period = "60s", terminate-after = 13 }

[profile.ci.junit]
path = "junit.xml"

[profile.hunt]
# The weekly flake hunt: no retries, so every failure counts in its tally.
retries = 0
fail-fast = false
failure-output = "final"

[profile.hunt.junit]
path = "junit.xml"
