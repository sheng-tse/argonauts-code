# What must hold before a release is published, checked by release.yml beside the Linux packages, once the builds
# are done: the GitHub release is created only if this job passes, and every publish job waits for that. dist
# itself checks that the tag matches the workspace's version. A dry run checks the notices only. Each check lives in
# packaging/release/checks.sh, which the rehearsal (rehearse.sh) runs too, on the release pull request's head.
name: Release checks

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: The release is made from main
        if: ${{ env.TAG != 'dry-run' }}
        run: sh packaging/release/checks.sh from-main
      - name: CI passed on the release's commit
        if: ${{ env.TAG != 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/release/checks.sh ci-passed "$GITHUB_SHA"
      # dist turns the section into the release notes. Betas need none. A section dated yesterday passes too, so a
      # release begun in the evening isn't stopped by midnight UTC.
      - name: A stable release has its changelog section, dated today or yesterday in UTC
        if: ${{ env.TAG != 'dry-run' }}
        run: sh packaging/release/checks.sh changelog "$TAG"
      - name: The README's release badge names the release
        if: ${{ env.TAG != 'dry-run' }}
        run: sh packaging/release/checks.sh badge "$TAG"
      - name: The update keys are real minisign keys
        if: ${{ env.TAG != 'dry-run' }}
        run: sh packaging/release/checks.sh update-keys
      - name: The installer the short address serves is packaging/install.sh
        if: ${{ env.TAG != 'dry-run' }}
        run: sh packaging/release/checks.sh short-installer
      - name: Install cargo-about
        run: |
          set -eu
          rustup update stable --no-self-update && rustup default stable
          cargo install --locked "cargo-about@$(sh packaging/release/checks.sh cargo-about-version)" --features cli
      - name: The third-party notices match Cargo.lock
        run: sh packaging/release/checks.sh notices
