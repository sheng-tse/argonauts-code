name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push to the same pull request or branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keeps each shard's cache small; a panic still names its line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The workspace's rust-version. A new Rust release brings new lints, so moving this is its
  # own change rather than something every pull request picks up on the day.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.pick.outputs.rust }}
      licenses: ${{ steps.pick.outputs.licenses }}
      packaging: ${{ steps.pick.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pick the jobs this change needs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base,
          # so HEAD^1..HEAD is exactly what the pull request changes. Main always runs it all,
          # and so does a pull request whose changed files can't be listed. With renames off, a
          # file moved out of crates/ counts where it left as well as where it went.
          rust=true licenses=true packaging=true
          changed="$RUNNER_TEMP/changed-files"
          if [[ "$EVENT" == pull_request ]] && git diff --name-only --no-renames HEAD^1 HEAD > "$changed"; then
            rust=false licenses=false packaging=false
            while IFS= read -r path; do
              case "$path" in
                # The crates build in Markdown of their own. The install-script tests read crates/ too.
                crates/*) rust=true licenses=true packaging=true ;;
                # The app builds in the changelog through crates/app/CHANGELOG.md.
                CHANGELOG.md) rust=true ;;
                deny.toml) licenses=true ;;
                packaging/*) packaging=true ;;
                *.md | assets/* | .github/ISSUE_TEMPLATE/* | .coderabbit.yaml) ;;
                # Cargo.toml, Cargo.lock, the workflows, and anything this list doesn't name.
                *) rust=true licenses=true packaging=true ;;
              esac
            done < "$changed"
          fi
          {
            echo "rust=$rust"
            echo "licenses=$licenses"
            echo "packaging=$packaging"
          } >> "$GITHUB_OUTPUT"
          echo "Rust jobs: $rust. Licenses: $licenses. Install script: $packaging."

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check

  clippy:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Room for all three tries of a test that hangs, 13 minutes each (.config/nextest.toml),
    # for the build and the steps after them, and for the drawings step's own limit.
    timeout-minutes: 130
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A macOS minute costs about ten Linux minutes while the repository is private, so a
        # private repository's pull requests run on Linux only. Main, and every pull request once
        # the repository is public, get both.
        os: ${{ (github.event_name == 'push' || github.event.repository.private == false) && fromJSON('["ubuntu-24.04", "macos-15"]') || fromJSON('["ubuntu-24.04"]') }}
        shard: [scenarios, crew, app, rest]
        include:
          # The slowest test programs get a shard each. The last takes every other package, so
          # a new crate is tested without anyone listing it here.
          - shard: scenarios
            packages: -p argonauts-scenarios
            # The drawings runner has a step of its own, on the release build.
            filter: not test(=app_drawings::every_drawing_matches_the_app)
          - shard: crew
            packages: -p argonauts-crew
          - shard: app
            packages: -p argonauts-app -p argonauts-code
          - shard: rest
            packages: >-
              --workspace --exclude argonauts-scenarios --exclude argonauts-crew
              --exclude argonauts-app --exclude argonauts-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9
      # Ubuntu 24.04's AppArmor takes every capability from an unprivileged user namespace, and
      # the Linux sandbox mounts each session's view of the files in one.
      - name: Allow user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A test that fails is tried twice more (.config/nextest.toml). One that passes on a retry
      # passes, and the step after names it.
      - name: cargo nextest
        env:
          PACKAGES: ${{ matrix.packages }}
          FILTER: ${{ matrix.filter || 'all()' }}
          # Shared runners stall now and then, macOS ones the most, so the tests' waits may take
          # this many times as long before they fail. A wait still ends once its state is there.
          ARGONAUTS_TEST_DEADLINE_SCALE: ${{ startsWith(matrix.os, 'macos') && '4' || '2' }}
        run: |
          read -ra packages <<< "$PACKAGES"
          cargo nextest run --locked --profile ci --no-fail-fast "${packages[@]}" -E "$FILTER"
      - name: Failed and flaky tests
        if: ${{ !cancelled() }}
        env:
          TITLE: Tests (${{ matrix.os }}, ${{ matrix.shard }})
        run: |
          python3 -I .github/scripts/junit_report.py --title "$TITLE" \
            --summary "$GITHUB_STEP_SUMMARY" target/nextest/ci/junit.xml
      # Every approved drawing on the real app, in a terminal of the size it was drawn for, as
      # the release build draws it (approved/MANIFEST.toml says how they are compared). It runs
      # once the shard's other tests are done, so nothing else slows the app between a key and
      # its frame. Each drawing unlike the app is reported as it is found, so a step stopped by
      # its limit still names them. The limit holds a cold release build, about 14 minutes on
      # three cores, and every drawing: some 2 minutes when all match, and a scaled wait on each
      # one unlike the app, 15 minutes for 17 of them at a scale of 2.
      - name: The approved drawings on the release build
        if: ${{ !cancelled() && matrix.shard == 'scenarios' }}
        timeout-minutes: 60
        env:
          ARGONAUTS_TEST_DEADLINE_SCALE: ${{ startsWith(matrix.os, 'macos') && '4' || '2' }}
        run: |
          cargo build --locked --release -p argonauts-code -p argonauts-testkit --bins
          ARGONAUTS_BIN="$PWD/target/release/argonauts" \
            ARGONAUTS_FAKE_CLI_BIN="$PWD/target/release/argonauts-fake-cli" \
            cargo test --locked -p argonauts-scenarios --test it -- --exact --nocapture \
            app_drawings::every_drawing_matches_the_app
      # nextest runs no doctests.
      - name: cargo test --doc
        if: ${{ !cancelled() }}
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra packages <<< "$PACKAGES"
          cargo test --locked --doc "${packages[@]}"
      # The world must cost under a percent of a core while it moves, on every level alike and
      # with a row lit: each test times the panel's whole work, drawing and packing included, by
      # its thread's own CPU. Drawn on threads as the app draws it, the world must draw a frame
      # only when something arrived, and a key must reach the screen in time. Each second is
      # judged as the reference Mac would have spent it, by a fixed yardstick timed on the same
      # thread right after it, so GitHub's slower virtual Macs are judged by the same limits,
      # and a machine over three times slower than the reference fails instead of passing
      # unjudged. The real binary must also keep up with 300 events a second; as the one test
      # that bounds the wall clock, it runs only here. So they run one at a time on an
      # optimized build, once, on the shard that holds the screen's crate, and the step fails
      # unless all nine ran. Until a macOS run here prints a pace under three with all nine
      # passing, no run has timed GitHub's Macs against the reference, so the step may fail
      # without failing the job.
      - name: The world's motion cost
        if: matrix.os == 'macos-15' && matrix.shard == 'rest'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --release -p argonauts-tui --lib -- --ignored --test-threads=1 \
            --exact \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_on_the_map \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_with_a_row_lit_and_the_pointer_moving \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_on_the_planet \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_in_the_universe \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_in_a_galaxy \
            app::map_picture::tests::world_cost_tests::the_world_costs_under_a_percent_of_a_core_in_a_system \
            app::map_picture::tests::world_cost_tests::the_world_on_threads_draws_a_frame_only_when_something_arrived \
            app::map_picture::tests::world_cost_tests::a_key_reaches_the_screen_in_time \
            | tee "$RUNNER_TEMP/motion.log"
          grep -q 'test result: ok. 8 passed' "$RUNNER_TEMP/motion.log"
          cargo test --locked --release -p argonauts-tui --test it -- --ignored --exact \
            pty_live::renders_300_events_per_second_at_120_columns \
            | tee "$RUNNER_TEMP/events.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/events.log"

  # One check for every shard, so the branch rules can require the tests: a matrix that was
  # skipped reports under its unexpanded name, which a required check would wait on forever.
  # Skipped counts only when Changes worked and picked no Rust jobs; a failed Changes job also
  # skips the shards, and that must not pass.
  tests:
    name: Tests
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          RESULT: ${{ needs.test.result }}
        run: |
          case "$RESULT/$CHANGES/$RUST" in
            success/*) echo "The test shards passed." ;;
            skipped/success/false) echo "No test shard was needed." ;;
            *) echo "::error::The test shards ended: $RESULT (Changes: $CHANGES, rust: $RUST)."; exit 1 ;;
          esac

  names:
    name: Names
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # It reads every tracked file, Markdown included, so it runs for a docs-only change too.
      # ARGONAUTS_DOCS stays unset, so only tracked files are checked.
      - run: cargo test --locked -p argonauts-testkit --test retired_names
      # Loose files in a src/, a module beside its folder, and files and crates past their size.
      - run: cargo test --locked -p argonauts-testkit --test source_layout

  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo publish --workspace --dry-run --locked

  licenses:
    name: Licenses
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses advisories sources

  packaging:
    name: Install script
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The curl install script, the update manifest's drafting script, the npm package's xz
      # check, the crash watch, the test report CI writes, the bot's commands, workflows and
      # crate labels, and the time the test job gives a test that hangs, against a fake curl,
      # release folders, query rows, JUnit reports and a GitHub the tests make up.
      - run: python3 -m unittest discover -s packaging/tests
      # The Release run runs the release scripts with dash, so they're linted as POSIX sh.
      # The runner image carries shellcheck.
      - run: shellcheck --shell=sh packaging/release/*.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      - name: zizmor
        env:
          # Lets zizmor look up pinned commits and known vulnerable actions.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  title:
    name: Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # A squash merge makes the title the commit's subject, so it follows the commit rules.
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|chore|ci|build)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title: $TITLE"
          else
            echo "::error title=Pull request title::Write the title as type(scope): subject, such as \"fix(tui): keep the cursor on the input\". The types are feat, fix, refactor, perf, test, docs, chore, ci and build; the scope is optional."
            exit 1
          fi
