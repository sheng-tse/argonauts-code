# Publishes the npm package dist built, so `npm i -g argonauts-code` and `npx argonauts-code` work. Called by
# release.yml in its publish step, with dist's plan.
#
# Stable releases go under the `latest` tag and betas under `next`, so a plain install never gets a beta. npm's
# trusted publishing trades this run's identity for a one-time token: no npm token is stored anywhere. npm checks
# the calling workflow's file name (release.yml) and the `release` environment, so both stay as they are.
#
# npm sets up trusted publishing only for a package that exists, so the first release's package is published by
# hand from a maintainer's machine (`npm publish --access public` on the package dist built, signed in to npm),
# then the package gets this repository's release.yml and the `release` environment as its trusted publisher, and
# every later release comes through here.
#
# npm never takes a version twice, so a version already there is skipped and a rerun of a release that got that far
# goes green. The package has the xz check (packaging/npm), which release.yml adds before the release uploads it, so
# npm gets the very file the release holds: on Linux it unpacks the program with the system's tar, which needs xz, and
# without it the install would end with only "tar: Error is not recoverable". A package without it isn't published.
name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  package:
    runs-on: ubuntu-24.04
    # Waits for the maintainer's approval once the repository is public.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Fetch the npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-global
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Install npm 11.21.0
        run: npm install --global npm@11.21.0
      - name: Publish
        run: |
          set -eu
          tag=latest
          if [ "$(echo "$PLAN" | jq --raw-output .announcement_is_prerelease)" = "true" ]; then
            tag=next
          fi
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq --raw-output '.artifacts[] | select(endswith("-npm-package.tar.gz"))')
            name=$(tar --extract --to-stdout --gzip --file "./npm/${pkg}" package/package.json | jq --raw-output .name)
            version=$(tar --extract --to-stdout --gzip --file "./npm/${pkg}" package/package.json | jq --raw-output .version)
            # Empty for a version npm doesn't have, and for a package it has never had, which npm says on stderr.
            published=$(npm view "${name}@${version}" version || true)
            if [ "$published" = "$version" ]; then
              echo "npm already has ${name} ${version}, so it's skipped."
              continue
            fi
            python3 packaging/npm/add_xz_check.py --has-check "./npm/${pkg}"
            npm publish --access public --tag "$tag" "./npm/${pkg}"
          done
