# release.yml is written by `dist generate` from dist-workspace.toml, so these findings are
# dist's to fix, and a hand edit would be undone by the next generate. Its actions are still
# pinned to commits through [dist.github-action-commits], so unpinned-uses holds it too.
#
# installer-smoke.yml installs the release it checks, and publish-npm.yml the exact npm that
# publishing needs, so neither install has a lockfile to come from.
#
# bot.yml answers /bot comments, which anyone can write, so it runs on issue_comment. It checks
# out only the default branch, hands the comment to its script through an environment variable,
# leaves the deciding of who may do what to that script, and acts through an app token that can
# rerun or stop runs and comment, nothing else.
#
# labels.yml labels pull requests from forks too, which needs pull_request_target. It checks out
# the base branch, reads the changed paths from GitHub's list of them, never runs the pull
# request's code, and its app token can only label pull requests.
rules:
  adhoc-packages:
    ignore:
      - installer-smoke.yml
      - publish-npm.yml
  dangerous-triggers:
    ignore:
      - bot.yml
      - labels.yml
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  artipacked:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
  self-repository:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
