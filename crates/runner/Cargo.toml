[package]
name = "argonauts-runner"
description = "Runs a workflow: a file of steps or a script, in a sandboxed JavaScript engine that can only ask for agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = ["/src/js/*.js", "/src/**/*.rs", "/LICENSE", "/NOTICE"]

[dependencies]
argonauts-core.workspace = true
futures.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
