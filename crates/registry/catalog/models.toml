# What /model says about each model. Argonauts ships this file, and each day it fetches the
# copy on the main branch, checked against models.toml.sha256 next to it, so a model that
# ships after a release still gets its description. Your own ~/.argonauts/models.toml wins.
#
# After an edit, update the hash, or the fetched copy is refused:
#   shasum -a 256 models.toml | cut -d' ' -f1 > models.toml.sha256
#
# Names come from the id ("claude-opus-5-5" reads "Opus 5.5"), so an entry sets `name` only
# when that rule reads wrong. `rank` is the order within a CLI's models, and `efforts` lists
# the levels a model takes, lowest first; an empty list means it takes none.

version = 1

# Claude Code, as its own picker shows it on 2026-10-09 (2.1.295).

[[model]]
id = "claude-code"
description = "Best for everyday, complex tasks"
recommended = true
runs = "claude-opus-5-5"

[[model]]
id = "claude-code/claude-opus-5-5"
description = "For complex work and everyday tasks"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "xhigh"
aliases = ["opus"]
rank = 1

[[model]]
id = "claude-code/claude-fable-5-1"
