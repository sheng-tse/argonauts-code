# Local coding models with tool use that /model offers to download where one isn't installed.
# Facts, not verdicts: each computer ranks them the same way, by the largest window from 64k,
# 32k or 16k whose memory fits two thirds of what models may use there, then the best coding
# score, then the newer, then the smaller. A model with no score or month ranks after those
# with one.
#
# `window` is the largest window a model is run at, `weights_gb` what its weights take once
# loaded, and `context_kib_per_token` what each token of its window adds: estimates until a
# model has loaded on a computer, when Ollama's own figure counts. `coding` is a public coding
# leaderboard's score, with the leaderboard and the day it was read, checked again monthly:
#   coding = { score = 51.0, source = "the leaderboard's name", checked = "2026-10-20" }
# `replaced_by` names the tag offered in a model's place.

[[local]]
tag = "qwen3-coder:30b"
name = "Qwen3 Coder 30B"
window = 65536
weights_gb = 19.0
download_gb = 19.0
context_kib_per_token = 96.0
released = "2025-07"

