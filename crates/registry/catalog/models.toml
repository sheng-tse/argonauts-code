# What /model says about each model. Argonauts Code ships this file, and each day it fetches the
# copy served beside the update manifests, signed with the same minisign keys as
# models.toml.minisig, so a model that ships after a release still gets its description. Your
# own ~/.argonauts/models.toml wins.
#
# Builds before 0.2.0 fetch this file from the main branch instead, checked against
# models.toml.sha256 next to it, so after an edit update the hash too:
#   shasum -a 256 models.toml | cut -d' ' -f1 > models.toml.sha256
#
# Names come from the id ("claude-opus-5-5" reads "Opus 5.5"), so an entry sets `name` only
# when that rule reads wrong. `rank` is the order within a CLI's models, and `efforts` lists
# the levels a model takes, lowest first; an empty list means it takes none. `window` is the
# most tokens a session holds, so the Context tab has it before a session or a model list says;
# a CLI's own figure and the lists read each day win over it. Claude's from Anthropic's model
# pages on 2026-10-30, Codex's from `codex debug models` (`max_context_window`, Codex 0.158.0),
# and agy's from Google's model pages ("Input token limit") and the other makers' own.

version = 1
# The day this copy is published, inside what its signature covers. Move it on with every edit:
# an install refuses a served copy published before the one it ships or fetched last.
published = "2026-10-30"

