[[model]]
id = "claude-code/opus"          # agent/model
provider = "anthropic"
kind = "cli"                 # CLI | endpoint
access = "subscription"          # subscription | api-key | local
tools = true
cost = { unit = "plan_usage" }   # plan_usage | usd | none, with input_per_mtok, output_per_mtok, cached_input_per_mtok
strengths = ["refactor"]
good_for = ["worker"]
efforts = ["low", "medium", "high", "xhigh", "max"]   # the levels it accepts; empty or absent means unknown
tier = 5                         # optional: your own strength rating, 1 to 5, for quality debt after a fallback

[[model]]
id = "codex/<model>"
provider = "openai"
kind = "cli"
access = "local"
cost = { unit = "none" }
launch = { oss = true, local_provider = "ollama" }

[[cli]]                      # a manifest CLI speaks Argonauts' JSONL protocol
id = "my-agent"
display_name = "My Agent"
binary = "my-agent"
read_only_args = ["--read-only", "--model", "{model}"]
build_args = ["--model", "{model}"]
provider = "<provider>"

[[cli]]                      # an ACP profile: data only, no adapter code
id = "my-acp-agent"
display_name = "My ACP Agent"
binary = "/opt/my-acp-agent/bin/agent"   # absolute, outside the repo
read_only_args = ["acp"]
build_args = ["acp"]
provider = "from-model"
transport = "acp"
errors = [{ pattern = "quota exceeded", category = "usage_limit" }]   # CLI-level keys go above [cli.acp]

[cli.acp]
modes = { read_only = "plan", build = "default" }
report = "mcp-tool"
resume = "none"
