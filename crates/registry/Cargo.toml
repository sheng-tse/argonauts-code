[package]
name = "argonauts-registry"
description = "Argonauts Code settings resolution, workflows and their files, CLI profiles, the model registry, and discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = ["/catalog/**", "/clis/**", "/src/**/*.rs", "/LICENSE", "/NOTICE"]

[dependencies]
argonauts-adapter-opencode.workspace = true
argonauts-core.workspace = true
# The served catalog's signature, checked against the keys that sign the update manifests.
minisign-verify.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
argonauts-testkit.workspace = true
# Signs the test catalogs with a key made for each test.
minisign.workspace = true
tempfile.workspace = true
tokio.workspace = true
