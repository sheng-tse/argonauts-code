# OpenCode over ACP, the first ACP profile. Values marked 1.18.34 were seen on OpenCode 1.18.34
# over stdio with a local Ollama on 2026-10-02. Its permission behavior over ACP and config
# isolation are not verified, and conformance pins the rest.
#
# No --standalone, which 2.0.32's `opencode acp` doesn't take: it starts a server of its own
# instead (`opencode serve --stdio --port 0`, its child, with the client's environment, read from
# its program text), so its sessions never go through OpenCode 2's shared service and stay
# inside the sandbox the client starts in. It talks to that server over HTTP on the loopback
# port the server reports, hence own_server, which keeps that port in reach with the network off.

[[cli]]
id = "opencode-acp"
display_name = "OpenCode (ACP)"
binary = "opencode"                           # found on PATH; agents.opencode-acp.binary overrides
version_args = ["--version"]
tested_versions = []                          # none yet: conformance pins the first
provider = "from-model"                         # OpenCode runs many providers
transport = "acp"
read_only_args = ["acp"]
build_args = ["acp"]
env_set = { OPENCODE_DISABLE_AUTOUPDATE = "1" }   # not verified: no self-update mid-session
own_server = true                             # its client and server talk over loopback
interactive_resume = []                       # no take-over command

[cli.acp]
modes = { read_only = "plan", build = "build", experiment = "build" }   # 1.18.34 takes both
# 1.18.34 offers a "model" config option. With no model set, it runs OpenCode Zen's hosted
# opencode/big-pickle, so Argonauts Code sends a local model from your registry instead, or asks
# you to set agents.opencode-acp.model.
model = "config-option"
effort = "none"
report = "mcp-tool"                           # 1.18.34 lists the tool; no call seen yet
resume = "resume"                             # 1.18.34 reopens a session in a new process
steer = "cancel-and-prompt"
usage = ["end-turn"]                          # 1.18.34 sends no usage_update
plan_usage = "none"
