[package]
name = "argonauts-code"
description = "Orchestrate any mix of coding agents and models, from Claude Code and Codex to open-weight models on your own machine."
repository.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = ["/src/**/*.rs", "/LICENSE", "/NOTICE"]

[[bin]]
name = "argonauts"
path = "src/main.rs"

# The one crate dist ships. The workspace turns it off for the rest, whose binaries are a
# sandbox helper and test tools. What each archive carries besides the binary is set once, in
# dist-workspace.toml: an `include` in this table would replace that list rather than add to it.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
argonauts-app.workspace = true
argonauts-conductor.workspace = true
argonauts-core.workspace = true
argonauts-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
argonauts-testkit.workspace = true
tempfile.workspace = true
time.workspace = true
