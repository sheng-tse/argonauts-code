[package]
name = "argonauts-code"
description = "Orchestrate any mix of coding agents and models, from Claude Code and Codex to open-weight models on your own machine."
repository.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "argonauts"
path = "src/main.rs"

# Released by dist even though the workspace isn't published to crates.io.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
argonauts-app.workspace = true
argonauts-conductor.workspace = true
argonauts-core.workspace = true
argonauts-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
argonauts-testkit.workspace = true
tempfile.workspace = true
time.workspace = true
