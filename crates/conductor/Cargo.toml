[package]
name = "argonauts-conductor"
description = "Argonauts Code conductor: runs agent sessions, worktrees, checks, and merges."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = ["/src/**/*.rs", "/LICENSE", "/NOTICE"]

# The sandbox launcher on its own, for tests that run it without building the whole app.
[[bin]]
name = "argonauts-sandbox"
path = "src/bin/argonauts-sandbox.rs"
test = false

[dependencies]
argonauts-core.workspace = true
anyhow.workspace = true
futures.workspace = true
globset.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
which.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
argonauts-adapter-antigravity-cli.workspace = true
argonauts-adapter-claude-code.workspace = true
argonauts-adapter-codex.workspace = true
argonauts-adapter-opencode.workspace = true
argonauts-testkit.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
