# tui, app and crew may only shrink too. Their ceilings are their counts in 0.2.1: tui
# 160,170, app 88,786 and crew 80,156.
# The listed files get no room: one that grows is split as its entry says.
[[crate]]
path = "crates/tui"
ceiling = 160170
split = "the crates its folders already form, cut right after 0.2.1: base, world, frame, cells, council, panels, bottom and the shell"

[[crate]]
