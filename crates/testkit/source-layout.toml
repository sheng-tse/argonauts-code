# What the source layout check allows today:
#
#   cargo test --locked -p argonauts-testkit --test source_layout
#
# A crate's src/ holds its entry file (lib.rs or main.rs) and folders by area, and a folder's
# module is its mod.rs. A file may hold 1,500 production lines and a crate 60,000: non-blank
# lines under src/ outside the tests. The files and crates over those limits are listed below,
# each with its count when listed as its ceiling and its planned split. A listed file or crate
# may only shrink, and comes off the list once it is back within the limit. Paths are from the
# workspace's top; a crate's is the one Cargo.toml lists among the members.

# core may only shrink. Its ceiling is its count in 0.2.1, 159 lines under 0.2.0's 43,877.
[core]
ceiling = 43718

# Crates whose src/ may hold .rs files beside the entry file, and why.
[exceptions]
"crates/scenarios" = "leftovers.rs beside lib.rs: two files, 444 lines, too small for folders"

[[file]]
path = "crates/crew/src/engine/host/mod.rs"
ceiling = 2384
split = "the Host's methods by kind: room and pauses, asking a model, sessions, access outside the project"

[[file]]
path = "crates/app/src/controller/conversation/mod.rs"
ceiling = 2133
