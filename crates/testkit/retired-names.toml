# Every retired name and the name that replaced it. `tests/retired_names.rs` fails when one
# comes back, in any tracked file or file name, and prints the replacement beside it.
#
# This is the one file that may spell a retired name. A new rename goes here in the commit
# that makes it, so the old name can't return.
#
# How it matches: each line is split into word parts (at anything that isn't a letter or a
# digit, at camelCase steps and between letters and digits) and lowercased, and a part must
# equal a listed form whole. Only the listed forms count, so list every ending that was in
# use. A word with a plain English sense of its own is banned as a phrase instead, and a
# plain use of a banned word is reworded, not allowed.

