    "crates/policy/tests/fixtures/live/**",
    # git's own output
    "crates/policy/tests/fixtures/diffs/**",
    # a run an older build wrote, kept in the words it wrote
    "crates/app/tests/fixtures/older-run/**",
    # a session's events from a run's log, with the model's own words
    "crates/conductor/fixtures/opencode/*.events.jsonl",
]

# ── Real names ───────────────────────────────────────────────────────────────────────────
# No real home folder and no real address belongs in a tracked file. Sample text uses one of
# the neutral folders and a reserved mail domain.

[private]
neutral_homes = ["you", "me", "someone", "user", "alice", "a"]
neutral_mail_endings = ["example.com", "example.org", "example.net", "example", "invalid", "test", "localhost", "127.0.0.1"]
# `@notes.txt` names a file, not an address.
file_endings = ["md", "txt", "rs", "toml", "json", "jsonl", "yaml", "yml", "sh", "py", "js", "ts", "lock", "log", "html", "css", "snap", "star"]
home_fix = "a neutral folder, such as /Users/you"
mail_fix = "a reserved address, such as you@example.com"
# Claude Code's scratch folder sits under the temp folder, named "claude-" and the user's id,
# and holds a folder named after the project's path, so a path inside it names the recording
# machine's account and its folders. A placeholder in place of the id is fine.
scratch_fix = "a neutral folder, such as /Users/you/scratch"

# A recording keeps the CLI's words but none of the recording machine's own setup: the
# skills its account synced, the plugins it installed, its claude.ai connectors, and the
# account's plan and organization. Each stands as its placeholder, numbered by letter.
[private.setup]
synced_skill = "anthropic-skills:example-"
plugin = "example-plugin-"
connector = "claude.ai Example "
connector_tool = "mcp__claude_ai_Example_"
plan = "<plan>"
organization = "<organization>"
fix = "its placeholder, as every Claude Code recording has it"
# The skills, commands and agents an init message may list: Claude Code's own in the recorded
# versions, as they and its program name them, and the ones a recording makes in its
# throwaway repo. Any other name came from the recording machine's own setup.
known = [
    "Explore", "Plan", "__remote-workflow", "advisor", "agents", "auto-mode-setup",
    "autocompact", "batch", "claude", "claude-api", "clear", "code-review", "color", "compact",
    "config", "context", "dataviz", "debug", "deep-research", "design", "design-consent",
    "design-revoke", "design-sync", "doctor", "effort", "extra-usage", "fast",
    "fewer-permission-prompts", "focus", "general-purpose", "goal", "heapdump", "import",
    "init", "insights", "list-agents", "loop", "mcp", "model", "output-style",
    "plugin-authoring", "recap", "reload-plugins", "reload-skills", "rename", "run",
    "run-skill-generator", "schedule", "security-review", "simplify", "skill-doctor",
    "statusline-setup", "team-onboarding", "ultrareview", "update-config", "usage",
    "usage-credits", "verify", "workflow-authoring", "workflow-launch-exec",
    "probe-cmd", "probe-late", "example-command",
]

# The names that were once in the code. Each is kept as its length and FNV-1a hash
# (lowercased), so this file doesn't hold them either.
[[private.banned]]
what = "a real home folder's name"
fix = "a neutral name, such as you"
length = 12
hash = "0x86b574fd3b73e"

[[private.banned]]
what = "a real mail address"
fix = "a reserved address, such as you@example.com"
length = 22
hash = "0x9d392f0bfbe1f65"

# ── Keys and their fields ────────────────────────────────────────────────────────────────
# A key of ours is spelled like its field. These files read someone else's JSON or TOML,
# whose keys aren't ours to choose.

[serde_keys]
not_ours = [
    "crates/adapters/**",
    # the CLIs' own usage files, read for the usage panel
    "crates/app/src/overview/import/**",
]

# ── Slash commands ───────────────────────────────────────────────────────────────────────
# A command is a SlashCommand variant of the same name. These are carried by another
# variant: the thing's full name, or one variant for both ways of a switch.

[slash_commands]
table = "crates/core/src/input.rs"

[slash_commands.variant_of]
learned = "LearnedWorkflows"
pin = "Mods"
settings = "Config"
unpin = "Mods"

# ── Recordings folders ───────────────────────────────────────────────────────────────────
# A folder under fixtures/ is named by CLI or by what it holds, never by a version, a date,
# a numbered change or mockup, or a model.

[fixture_folders]
models = ["haiku", "sonnet", "opus", "fable", "gpt", "luna", "gemini", "llama", "glm", "qwen", "mistral", "deepseek"]
numbered = ["change", "mock", "mockup", "design", "round", "fix", "draft"]

