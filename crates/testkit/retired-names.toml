✘ retired names · 3 places
  crates/tui/src/bridge/transcript/steps.rs:256   "coordinated" → orchestrator
  crates/app/src/setup/questions.rs:456           "coordinates" → orchestrator
  crates/crew/src/labels.rs:144                   "handoff" → fallback

  one table holds every retired name and its replacement (crates/testkit/retired-names.toml);
  words are matched whole, so seatbelt or discard never trip it; CLI recordings are checked by name only
'''

[[report_example.places]]
path = "crates/crew/src/labels.rs"
line = 144
word = "handoff"

[[report_example.places]]
path = "crates/tui/src/bridge/transcript/steps.rs"
line = 256
word = "coordinated"

[[report_example.places]]
path = "crates/app/src/setup/questions.rs"
line = 456
word = "coordinates"

