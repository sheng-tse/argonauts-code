[package]
name = "argonauts-app"
description = "Argonauts Code's app controller and run host: the conversation, routing, choosing Captain or crew, and the run host each run has."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = [
    "/CHANGELOG.md",
    "/src/setup/readme/argonauts.md",
    "/src/controller/conversation/starting_baselines.toml",
    "/src/**/*.rs",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
anyhow.workspace = true
argonauts-adapter-acp.workspace = true
argonauts-adapter-antigravity-cli.workspace = true
argonauts-adapter-claude-code.workspace = true
argonauts-adapter-codex.workspace = true
argonauts-adapter-manifest.workspace = true
argonauts-adapter-opencode.workspace = true
argonauts-conductor.workspace = true
argonauts-core.workspace = true
argonauts-crew.workspace = true
argonauts-endpoints.workspace = true
argonauts-learning.workspace = true
argonauts-mcp.workspace = true
argonauts-policy.workspace = true
argonauts-registry.workspace = true
argonauts-runner.workspace = true
argonauts-tui.workspace = true
futures.workspace = true
nix.workspace = true
# A CLI that names its account only on its start-up screen is read in a hidden terminal.
portable-pty.workspace = true
# What `argonauts self-update` prints, drawn in the screen's colours.
ratatui.workspace = true
reqwest.workspace = true
regex.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
sysinfo.workspace = true
# A release archive as dist builds it, .tar.xz, unpacked by a new version of Argonauts Code.
tar.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-width.workspace = true
tracing.workspace = true
uuid.workspace = true
vt100.workspace = true
xz2.workspace = true
# The update manifest's signature, checked against the keys built in.
minisign-verify.workspace = true

[dev-dependencies]
argonauts-testkit.workspace = true
# Signs the test manifests with a key made for each test.
minisign.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
