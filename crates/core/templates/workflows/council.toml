# Council: no single planner. Every seat answers your request alone, then the seats talk until
# they agree. Nothing reads the request first, and the plan is the first thing you approve.
name  = "council"
about = "No single planner: every seat answers alone, then they talk until they all agree"

[[phases]]
name     = "Talk"
detail   = "every seat answers alone, then one seat writes at a time until every seat agrees on every point"
standard = "plan"

  [[phases.steps]]
  kind  = "loop_until"
  name  = "planning"
  until = "plan_decided"
  max   = 3

    [[phases.steps.steps]]
    kind  = "talk"
    name  = "talk"
    role  = "draft"
    label = "talk:{provider}"

    [[phases.steps.steps]]
    kind     = "approval"
    approval = "plan"

[[phases]]
name     = "Build"
detail   = "one worker per task in its own worktree, its checks, then a review from another provider"
standard = "do"

  [[phases.steps]]
  kind  = "build"
  role  = "worker"
  input = "plan"
  label = "build:{item}"

[[phases]]
name     = "Merge"
detail   = "the final check, then the merge into your branch"
standard = "decide"

  [[phases.steps]]
  kind  = "merge"
  label = "merge:{branch}"
