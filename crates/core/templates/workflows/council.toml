# Council: no single planner. Also called multi-agent debate.
name  = "council"
about = "No single planner: everyone proposes and challenges, the judge decides"
adapt = true

[[step]]
name        = "Propose"
role        = "worker"
count       = "all"          # every worker writes a plan
independent = true           # without seeing the others'
keep        = true           # however the request is adapted

[[step]]
name  = "Challenge"
role  = "worker"
count = "all"
does  = "Argue against the other proposals. Their authors are hidden."
keep  = true

[[step]]
name = "Decide"
role = "judge"
does = "Pick the strongest plan or join the best parts. Split it into tasks."
keep = true

[[step]]
name     = "Build"
role     = "worker"
for_each = "task"

[[step]]
name           = "Cross-review"
role           = "worker"
for_each       = "task"
not_the_author = true        # each task goes to a worker who didn't build it
send_back_to   = "Build"

[[step]]
name = "Sign-off"
role = "judge"

# Its phases, which run in place of the steps above when workflows.adapt_with = "phases".
[[phases]]
name     = "Understand"
detail   = "models from several providers read the request, and others compare the readings"
standard = "understand"

  [[phases.steps]]
  kind  = "loop_until"
  name  = "understanding"
  until = "understood"
  max   = 2

    [[phases.steps.steps]]
    kind  = "read"
    name  = "readings"
    role  = "reader"
    label = "read:{provider}"

    [[phases.steps.steps]]
    kind  = "compare"
    name  = "differences"
    role  = "comparer"
    input = "readings"
    label = "compare:{n}"

    [[phases.steps.steps]]
    kind     = "approval"
    approval = "understand"

[[phases]]
name     = "Plan"
detail   = "blind drafts, a map of where they disagree, critique, then one plan merged or judged"
standard = "plan"

  [[phases.steps]]
  kind  = "loop_until"
  name  = "planning"
  until = "plan_decided"
  max   = 3

    [[phases.steps.steps]]
    kind  = "draft"
    name  = "drafts"
    role  = "draft"
    blind = true
    input = "goal"
    label = "draft:{provider}"

    [[phases.steps.steps]]
    kind  = "map"
    name  = "map"
    role  = "map"
    input = "drafts"
    label = "map:{n}"

    [[phases.steps.steps]]
    kind  = "loop_until"
    name  = "critique"
    until = "critique_done"
    max   = 3

      [[phases.steps.steps.steps]]
      kind  = "critique"
      name  = "critiques"
      role  = "critic"
      input = "map"
      label = "critique:{provider}"

      [[phases.steps.steps.steps]]
      kind  = "draft"
      name  = "revisions"
      role  = "draft"
      input = "critiques"
      label = "revise:{provider}"

      [[phases.steps.steps.steps]]
      kind  = "map"
      name  = "remap"
      role  = "map"
      input = "revisions"
      label = "remap:{n}"

    [[phases.steps.steps]]
    kind  = "synthesize"
    name  = "merged"
    role  = "draft"
    input = "drafts"
    when  = "drafts_agree"
    label = "synthesize:{provider}"

    [[phases.steps.steps]]
    kind  = "judge"
    name  = "scores"
    role  = "judge"
    blind = true
    input = "drafts"
    when  = "drafts_disagree"
    label = "judge:{provider}"

    [[phases.steps.steps]]
    kind     = "approval"
    approval = "plan"

[[phases]]
name     = "Build"
detail   = "one worker per task in its own worktree, its checks, then a review from another provider"
standard = "do"

  [[phases.steps]]
  kind  = "build"
  role  = "worker"
  input = "plan"
  label = "build:{item}"

[[phases]]
name     = "Merge"
detail   = "the final check, then the merge into your branch"
standard = "decide"

  [[phases.steps]]
  kind  = "merge"
  label = "merge:{branch}"
