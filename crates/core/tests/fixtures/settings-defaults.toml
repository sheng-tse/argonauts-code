    "claude-code",
    "codex",
    "antigravity-cli",
]
reviewer = [
    "claude-code",
    "codex",
    "antigravity-cli",
]
judge = [
    "claude-code",
    "codex",
    "antigravity-cli",
]
worker_workflows = false
merger = []

[agents.antigravity-cli]
enabled = true
auth = "subscription"
extra_args = []
exclude_paths = []

[agents.claude-code]
enabled = true
auth = "subscription"
extra_args = []
exclude_paths = []

[agents.codex]
enabled = true
auth = "subscription"
extra_args = []
exclude_paths = []

[agents.opencode]
enabled = true
auth = "subscription"
extra_args = []
exclude_paths = []

[endpoints]

[roles]

[fallback]
mode = "auto"
order = []
ask_timeout = "none"
allow_api_billing = false
broken_work = "continue"
wrap_up = "let_finish"
strategy = "first"
together = 1
on_return = "ask"
checkpoint = true
merge_rule = "upgrade_review"
unknown_tier = "weaker"
max_fallbacks = 3
same_cli = false
same_step = "ask"
context = "note+transcript"

[fallback.retry]
tries = 1
wait = "5s"
backoff = "fixed"

[fallback.replace]

[intake]
include_uncommitted = false

[captain_or_crew]
use_learned = true
captain_max_files = 3
captain_requires_tests = true
crew_min_files = 8
crew_labels = [
    "architecture",
    "migration",
    "security",
]
otherwise = "captain_then_crew"
captain_kind = "checked"
read_instructions = true

[captain]
kind = "direct"
asks = "like_cli"
rewind = true
rewind_max_mb = 50
start_workflow_tool = true
understand_first = false
review = false
tries = 1

[understand]
when = "crew"
comparers = 2
max_questions = 3
always_ask = [
    "scope",
    "security",
    "data",
    "cost",
]
majority_assumptions = true

[goal]
default = "off"
check = "auto"
stuck_after = 3
checker = "other_provider"

[drafting]
by = "crew"
blind = true

[mapping]
quote_check = true
remap_after_revision = true

[critique]
rounds = 1
critic = "rotate"
checklist = [
    "Does it meet every success criterion?",
    "What breaks first under load or failure?",
    "What is hard to test?",
    "What is more complex than it needs to be?",
    "What does it cost to run?",
]

[experiments]
enabled = true
limit_usd = 2.0
time_box_min = 15.0

[judging]
method = "cross"
anonymize = true
both_orders = true
rubric = [
    "correctness_risk",
    "completeness",
    "testability",
    "simplicity",
    "cost",
]
clear_winner_margin = 1.0
reserve_non_drafting_judge = false

[divide]
contracts_first = true
acceptance_tests_by = "reviewer"
chores = "rotate"
max_tasks = 12
predictions = true
single_worker = false

[review]
assign = "ring"
other_provider = true
per_task = 1
blind = false
max_change_rounds = 2
max_diff_lines = 4000

[checks]
run = []
full_suite = []
timeout = "30m"
setup = []
copy_untracked = []

[routing]
algorithm = "bandit"
explore_rate = 0.1
no_explore_labels = [
    "security",
    "migration",
]
tie_band = 0.05
prior_strength = 3.0
half_life_days = 30.0
max_explore_share = 0.2
own_type_after = 10
model_change_keep = 0.2
claim_above = 0.9
overconfident_margin = 0.2
overconfident_after = 10

[routing.weights]
pass_rate = 1.0
approval_rate = 0.5
prediction = 0.3
cost = 0.4
time = 0.2

[routing.groups]
backend_and_data = [
    "backend",
    "data",
]
docs_and_refactor = [
    "docs",
    "refactor",
]
frontend = ["frontend"]
infra_and_tests = [
    "infra",
    "tests",
]
security_and_performance = [
    "security",
    "performance",
]

[routing.priors]

[routing.pins]

[routing.resets]

[approvals]
autopilot = false
start_mode = "last"
decides = "judge"
ask_you_about = []
when_declined = "decide"
ask_limit = 2
goal_changes = "ask"
spot_check_sample = 0.1
pause_auto_when_spot_checks_waiting = 5
suggest_auto_after_matches = 20
presence = "warn"
refuse_ancestor_env = [
    "OPENCLAW_SHELL",
    "HERMES_SESSION_ID",
]
allow_commands = []

[approvals.rules.plan]
max_score_spread = 1.0
min_winner_margin = 1.5

[approvals.rules.merge]
min_test_coverage_of_changed_lines = 0.8
