allow_debt = false

[approvals.rules.workflow_promotion]
change_classes = [
    "checklist_item",
    "critique_rounds",
    "drafting_prompt",
    "task_split",
    "task_limit",
]
min_days_between = 14

[approvals.rules.stuck]
max_extra_tries = 1

[approvals.rules.limit]
use_reserve = true

[approvals.understand]
mode = "auto"
decide_with = "rules_and_model"
otherwise = "ask"
at_hard_limit = "stop"

[approvals.plan]
mode = "auto"
decide_with = "rules_and_model"
otherwise = "ask"
at_hard_limit = "stop"

[approvals.merge]
mode = "auto"
decide_with = "rules"
otherwise = "ask"
