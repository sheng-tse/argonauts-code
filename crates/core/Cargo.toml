[package]
name = "argonauts-core"
description = "Shared types, traits, event log, config, and spend meter for Argonauts Code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with: build.rs makes the table of `templates/`. Tests and the
# pictures, snapshots and recordings they read stay in the repository.
include = ["/build.rs", "/templates/**", "/src/**/*.rs", "/LICENSE", "/NOTICE"]

[dependencies]
base64.workspace = true
anyhow.workspace = true
dirs.workspace = true
jsonschema.workspace = true
nix = { workspace = true, features = ["user"] }
regex.workspace = true
schemars.workspace = true
serde.workspace = true
# Objects keep the order their keys were written in, so an answer format lists a type's fields
# as it declares them, whichever crates are built with it.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
shell-words.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
