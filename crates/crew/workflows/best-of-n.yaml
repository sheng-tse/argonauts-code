name: best-of-n
description: Independent attempts at one card, keeping one that passes the visible gates
params:
  attempts: 3
phases:
  - name: Understand
    detail: your prompt is the goal, unless solo.restate_first asks the agent to restate it
    standard: understand
    steps:
      - kind: restate
        name: restatement
        role: default
        label: "read:{family}"
      - kind: checkpoint
        checkpoint: goal
        when: restate_first
  - name: Build
    detail: independent attempts at the card, each in its own worktree, keeping one that passes the gates
    standard: do
    steps:
      - kind: build
        role: owner
        input: goal
        count: "{{attempts}}"
        label: "build:{item}"
  - name: Merge
    detail: the final check, then the merge into your branch
    standard: decide
    steps:
      - kind: merge
        label: "merge:{branch}"
