name: maker-checker
description: The main agent alone, with its task reviewed by another model family before the merge approval
phases:
  - name: Understand
    detail: your prompt is the goal, unless solo.restate_first asks the agent to restate it
    standard: understand
    steps:
      - kind: restate
        name: restatement
        role: main
        label: "read:{family}"
      - kind: checkpoint
        checkpoint: goal
        when: restate_first
  - name: Build
    detail: the main agent builds the task in its own worktree, its gates, then a review from another company
    standard: do
    steps:
      - kind: build
        role: worker
        input: goal
        different_family_from: author
        label: "build:{item}"
  - name: Merge
    detail: the final check, then the merge into your branch
    standard: decide
    steps:
      - kind: merge
        label: "merge:{branch}"
