name: council
description: Peers restate the goal, draft plans blind, debate only where the drafts disagree, and build tasks reviewed by another family
phases:
  - name: Understand
    detail: models from several companies read the request, and others compare the readings
    standard: understand
    steps:
      - kind: loop_until
        name: goal
        until: goal_approved
        max: 2
        steps:
          - kind: restate
            name: restatements
            role: restater
            label: "read:{family}"
          - kind: differ
            name: differences
            role: differ
            input: restatements
            label: "compare:{n}"
          - kind: checkpoint
            checkpoint: goal
  - name: Plan
    detail: blind drafts, a map of where they differ, critique, then one plan merged or judged
    standard: plan
    steps:
      - kind: loop_until
        name: planning
        until: plan_decided
        max: 3
        steps:
          - kind: draft
            name: drafts
            role: drafter
            blind: true
            input: goal
            label: "draft:{family}"
          - kind: map
            name: map
            role: mapper
            input: drafts
            label: "map:{n}"
          - kind: loop_until
            name: critique
            until: critique_done
            max: 3
            steps:
              - kind: refute
                name: critiques
                role: critic
                input: map
                label: "critique:{family}"
              - kind: draft
                name: revisions
                role: drafter
                input: critiques
                label: "revise:{family}"
              - kind: map
                name: remap
                role: mapper
                input: revisions
                label: "remap:{n}"
          - kind: synthesize
            name: merged
            role: drafter
            input: drafts
            when: drafts_agree
            label: "synthesize:{family}"
          - kind: judge
            name: scores
            role: judge
            blind: true
            input: drafts
            when: drafts_disagree
            label: "judge:{family}"
          - kind: checkpoint
            checkpoint: plan
  - name: Build
    detail: one worker per task in its own worktree, its gates, then a review from another company
    standard: do
    steps:
      - kind: build
        role: worker
        input: plan
        label: "build:{item}"
  - name: Merge
    detail: the final check, then the merge into your branch
    standard: decide
    steps:
      - kind: merge
        label: "merge:{branch}"
