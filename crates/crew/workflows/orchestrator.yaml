name: orchestrator
description: One orchestrator plans the tasks, workers build them, blind reviewers review, and an adjudicator settles their disagreements
phases:
  - name: Understand
    detail: models from several companies read the request, and others compare the readings
    standard: understand
    steps:
      - kind: loop_until
        name: goal
        until: goal_approved
        max: 2
        steps:
          - kind: restate
            name: restatements
            role: restater
            label: "read:{family}"
          - kind: differ
            name: differences
            role: differ
            input: restatements
            label: "compare:{n}"
          - kind: checkpoint
            checkpoint: goal
  - name: Plan
    detail: one orchestrator plans the tasks, and you or your rules approve them
    standard: plan
    steps:
      - kind: loop_until
        name: planning
        until: plan_decided
        max: 3
        steps:
          - kind: draft
            name: coordinated
            role: orchestrator
            input: goal
            label: "plan:orchestrator"
          - kind: checkpoint
            checkpoint: plan
  - name: Build
    detail: one worker per task in its own worktree, its gates, then blind reviews from another company
    standard: do
    steps:
      - kind: build
        role: worker
        input: plan
        label: "build:{item}"
  - name: Merge
    detail: the final check, then the merge into your branch
    standard: decide
    steps:
      - kind: merge
        label: "merge:{branch}"
