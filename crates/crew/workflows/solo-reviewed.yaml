name: solo-reviewed
description: The default agent alone, with its card reviewed by another model family before the merge checkpoint
phases:
  - name: Goal
    standard: understand
    steps:
      - kind: restate
        name: restatement
        role: default
      - kind: checkpoint
        checkpoint: goal
        when: restate_first
  - name: Build
    standard: do
    steps:
      - kind: build
        role: owner
        input: goal
        different_family_from: author
  - name: Merge
    standard: decide
    steps:
      - kind: merge
