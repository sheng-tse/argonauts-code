name: draft-and-vote
description: Blind drafts, a majority vote on the plan, and one owner builds it
phases:
  - name: Understand
    detail: models from several companies read the request, and others compare the readings
    standard: understand
    steps:
      - kind: loop_until
        name: goal
        until: goal_approved
        max: 2
        steps:
          - kind: restate
            name: restatements
            role: restater
            label: "read:{family}"
          - kind: differ
            name: differences
            role: differ
            input: restatements
            label: "compare:{n}"
          - kind: checkpoint
            checkpoint: goal
  - name: Plan
    detail: blind drafts, then a majority vote on the plan
    standard: plan
    steps:
      - kind: loop_until
        name: planning
        until: plan_decided
        max: 3
        steps:
          - kind: draft
            name: drafts
            role: drafter
            blind: true
            input: goal
            label: "draft:{family}"
          - kind: judge
            name: votes
            role: judge
            blind: true
            input: drafts
            params:
              method: vote
            label: "vote:{family}"
          - kind: checkpoint
            checkpoint: plan
  - name: Build
    detail: one owner builds the plan in its own worktree, its gates, then a review from another company
    standard: do
    steps:
      - kind: build
        role: owner
        input: plan
        label: "build:{item}"
  - name: Merge
    detail: the final check, then the merge into your branch
    standard: decide
    steps:
      - kind: merge
        label: "merge:{branch}"
