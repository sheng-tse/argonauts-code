[package]
name = "argonauts-tui"
description = "Argonauts Code terminal interface: the inline conversation screen, its overlays, and the screen-reader mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = [
    "/assets/logos/*.png",
    "/assets/mascots/cells.json",
    "/assets/mascots/pictures.json",
    "/assets/mascots/pictures/**",
    "/data/**",
    "/examples/*.rs",
    "/src/**/*.rs",
    "/LICENSE",
    "/NOTICE",
]

[[bin]]
name = "argonauts-tui-driver"
path = "src/bin/argonauts-tui-driver.rs"
test = false

[dependencies]
anyhow.workspace = true
argonauts-core.workspace = true
base64.workspace = true
crossterm.workspace = true
dirs.workspace = true
# The mascot's pictures: reading, fitting and writing PNGs.
flate2.workspace = true
futures.workspace = true
nix.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
signal-hook.workspace = true
similar.workspace = true
syntect.workspace = true
thiserror.workspace = true
time.workspace = true
# The world's drawing: anti-aliased paths, gradients and blending.
tiny-skia.workspace = true
tokio.workspace = true
toml.workspace = true
two-face.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
# Its parser reads the recorded Claude Code streams the golden tests replay.
argonauts-adapter-claude-code.workspace = true
argonauts-testkit.workspace = true
insta.workspace = true
regex.workspace = true
strip-ansi-escapes.workspace = true
tempfile.workspace = true
vt100.workspace = true
