[package]
name = "argonauts-tui"
description = "Argonauts Code terminal interface: the inline conversation screen, its overlays, and the screen-reader mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "argonauts-tui-driver"
path = "src/bin/argonauts-tui-driver.rs"
test = false

[dependencies]
anyhow.workspace = true
argonauts-core.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
dirs.workspace = true
futures.workspace = true
nix = { workspace = true, features = ["poll", "term"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
signal-hook.workspace = true
similar = { workspace = true, features = ["inline"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width.workspace = true

[dev-dependencies]
argonauts-testkit.workspace = true
insta.workspace = true
# The hangup tests open their own pty and keep its side from the app.
nix = { workspace = true, features = ["fs", "poll", "term"] }
regex.workspace = true
strip-ansi-escapes.workspace = true
tempfile.workspace = true
vt100.workspace = true
