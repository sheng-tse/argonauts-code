<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The hydra that Heracles, one of the Argonauts, fought, with three heads arguing over one body: one strong, one overwhelmed, and one goofy, like whichever model everyone is teasing that day, so the other two catch its mistakes. -->
  <!-- Argonauta. Council: the hydra. One head strong, one overwhelmed, one goofy. Normal. -->
  <g transform="translate(-2.5 5)">
  <!-- necks, widening into the body: the strong one rising straight, the overwhelmed one sagging, the goofy one curving out -->
  <path d="M40.44 70.65 C29.11 64.06 20.05 63.47 23.27 57.71 A4.60 4.60 0 0 0 14.73 54.29 C9.95 68.53 22.89 75.94 31.56 83.35 Z" fill="#E8A33D"/>
  <path d="M56.23 77.51 C56.22 61.79 57.78 45.22 55.27 31.39 A5.30 5.30 0 0 0 44.73 32.61 C45.22 44.78 41.78 60.21 39.77 76.49 Z" fill="#E8A33D"/>
  <path d="M63.58 83.87 C75.78 76.16 85.41 62.79 88.38 50.39 A4.60 4.60 0 0 0 79.62 47.61 C75.59 57.21 67.22 65.84 56.42 70.13 Z" fill="#E8A33D"/>
  <!-- body, one shape that flows into the tail, which curls up at the tip -->
  <path d="M30 71 C23 72 19 78 21 83 C23 88 32 91 46 91 C58 91 66 89 73 86 C80 83 87 80 91 75 C94 71 94 67 92 64.5 A1.6 1.6 0 0 0 89 66 C90 69 89 73 85 75.5 C80 78.5 74 79 69 77 C66 73 60 70 50 69.5 C41 69 35 70 30 71 Z" fill="#E8A33D"/>
  <!-- the overwhelmed head, slumped low, its horns wilting -->
  <g transform="rotate(22 21 48)">
  <path d="M16.14 38 C11.50 36.27 7.02 39.37 6.41 44.88 A0.60 0.60 0 0 0 7.59 45.12 C8.98 40.63 11.50 39.73 13.86 42 Z" fill="#B07020"/>
  <path d="M28.14 42 C30.50 39.73 33.02 40.63 34.41 45.12 A0.60 0.60 0 0 0 35.59 44.88 C34.98 39.37 30.50 36.27 25.86 38 Z" fill="#B07020"/>
  <ellipse cx="21" cy="46" rx="11.5" ry="10.5" fill="#E8A33D"/>
  </g>
  <!-- the strong head, biggest and upright, horns swept back; in ultra they turn gold, the immortal head of the myth -->
  <path d="M43.35 10.52 C35.75 9.20 29.21 10.64 25.65 5.62 A0.75 0.75 0 0 0 24.35 6.38 C27.79 13.36 35.25 13.80 41.65 16.48 Z" fill="#B07020"/>
  <path d="M58.35 16.48 C64.75 13.80 72.21 13.36 75.65 6.38 A0.75 0.75 0 0 0 74.35 5.62 C70.79 10.64 64.25 9.20 56.65 10.52 Z" fill="#B07020"/>
  <ellipse cx="50" cy="21" rx="13" ry="12" fill="#E8A33D"/>
  <!-- the goofy head, tipped sideways, one horn up and one flopped over -->
  <g transform="translate(5.5 2) rotate(-26 80 37)">
  <path d="M77.17 26.64 C75.67 20.77 74.66 16.12 75.62 11.71 A0.65 0.65 0 0 0 74.38 11.29 C72.34 15.88 72.33 21.23 72.83 27.36 Z" fill="#B07020"/>
  <path d="M87.46 29.14 C90.98 25.11 95.21 25.35 96.87 30.17 A0.65 0.65 0 0 0 98.13 29.83 C96.79 23.65 90.02 21.89 84.54 25.86 Z" fill="#B07020"/>
  <ellipse cx="80" cy="36" rx="12.5" ry="12" fill="#E8A33D"/>
  </g>
  <!-- overwhelmed: dizzy spiral eyes -->
  <g transform="rotate(22 21 48)">
  <g ><path d="M16.5 45.5 a0.9 0.9 0 0 1 1.8 0 a1.8 1.8 0 0 1 -3.6 0 a2.7 2.7 0 0 1 5.4 0 a3.6 3.6 0 0 1 -7.2 0" fill="none" stroke="#2B2B2B" stroke-width="1.3" stroke-linecap="round"/></g>
  <g ><path d="M25.5 45.5 a0.9 0.9 0 0 1 1.8 0 a1.8 1.8 0 0 1 -3.6 0 a2.7 2.7 0 0 1 5.4 0 a3.6 3.6 0 0 1 -7.2 0" fill="none" stroke="#2B2B2B" stroke-width="1.3" stroke-linecap="round"/></g>
  </g>
  <!-- strong: heavy brows over a narrowed glare -->
  <path d="M40.5 14.8 L47.5 18.2 M59.5 14.8 L52.5 18.2" stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M42.00 18.28 A3.7 3.7 0 1 0 48.14 20.43 Z" fill="#2B2B2B"/><circle cx="45.61" cy="21.74" r="1.04" fill="#E8A33D"/>
  <path d="M51.86 20.43 A3.7 3.7 0 1 0 58.00 18.28 Z" fill="#2B2B2B"/><circle cx="56.61" cy="21.74" r="1.04" fill="#E8A33D"/>
  <!-- goofy: huge mismatched googly eyes looking two ways -->
  <g transform="translate(5.5 2) rotate(-26 80 37)">
  <circle cx="73.8" cy="34" r="7" fill="#E8A33D" stroke="#2B2B2B" stroke-width="1.8"/><g ><circle cx="70.8" cy="30.8" r="2.24" fill="#2B2B2B"/></g>
  <circle cx="87.6" cy="36.2" r="4.2" fill="#E8A33D" stroke="#2B2B2B" stroke-width="1.8"/><g ><circle cx="89.39999999999999" cy="38.2" r="1.60" fill="#2B2B2B"/></g>
  </g>
  </g>
</svg>
