[package]
name = "argonauts-adapter-manifest"
description = "Argonauts Code CLI manifests: a generic adapter for simple CLIs described as data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with. Tests and the pictures, snapshots and recordings they read
# stay in the repository.
include = ["/src/**/*.rs", "/LICENSE", "/NOTICE"]

[dependencies]
anyhow.workspace = true
argonauts-core.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
