[package]
name = "argonauts-adapter-antigravity-cli"
description = "agy adapter for Argonauts Code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the crate builds with: build.rs reads the versions the recordings stand for from
# their .meta.json files. Tests and the recordings themselves stay in the repository.
include = ["/build.rs", "/fixtures/*.meta.json", "/src/**/*.rs", "/LICENSE", "/NOTICE"]

[dependencies]
anyhow.workspace = true
argonauts-core.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
