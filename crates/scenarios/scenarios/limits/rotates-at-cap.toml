# The fake Claude Code's context grows past the rotation cap in its first message and then
# keeps working. The session rotates, and a fresh one finishes the card.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# A fresh session whose handoff note carries the stopped session's last message finishes it.
[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
stdin_prompt = "line"
prompt_contains = "LIMITS-PROGRESS-NOTE"
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits","apiKeySource":"none"}'
[[rule.step]]
write = { path = "notes.txt", content = "first half\n" }
[[rule.step]]
emit = '{"type":"stream_event","event":{"type":"message_start","message":{"model":"claude-haiku-4-5-20251001","id":"msg_limits_1","type":"message","role":"assistant","content":[],"stop_reason":null,"usage":{"input_tokens":9,"cache_creation_input_tokens":20000,"cache_read_input_tokens":140000,"output_tokens":1}}},"session_id":"limits-claude-1","parent_tool_use_id":null}'
[[rule.step]]
emit = '{"type":"assistant","message":{"id":"msg_limits_1","type":"message","role":"assistant","model":"claude-haiku-4-5-20251001","content":[{"type":"text","text":"LIMITS-PROGRESS-NOTE: notes.txt holds the first half."}],"usage":{"input_tokens":9,"cache_creation_input_tokens":20000,"cache_read_input_tokens":140000,"output_tokens":40}},"session_id":"limits-claude-1","parent_tool_use_id":null}'
[[rule.step]]
hang = true
