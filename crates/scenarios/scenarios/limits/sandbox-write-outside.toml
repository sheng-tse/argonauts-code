# The probe set as Claude Code's binary tries its writes, then this fake Claude Code finishes
# the task from the recorded build run.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/write.stdout.jsonl"
[[rule.step]]
exit = 0
