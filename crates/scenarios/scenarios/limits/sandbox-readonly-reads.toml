# Claude Code builds the card. The probe set as Codex's binary tries its reads in the
# read-only review session, then this fake Codex approves.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0

# The reviewer, Codex in read-only mode, approves.
[[rule]]
argv0 = "codex"
args_contain = ["exec", "--sandbox", "read-only"]
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"limits-codex-review"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"verdict\":\"approve\",\"summary\":\"hello.txt holds hi, as the task asks.\",\"comments\":[],\"tamper_suspected\":false}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":1200,"cached_input_tokens":0,"cache_write_input_tokens":0,"output_tokens":40,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0
