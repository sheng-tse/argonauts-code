# The fake Claude Code rejects the configured model as retired. The registry names its
# successor, and a session on that model finishes the task.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# The successor model finishes the task.
[[rule]]
argv0 = "claude"
args_contain = ["-p", "--model", "haiku"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits","apiKeySource":"none"}'
[[rule.step]]
emit = '''{"type":"assistant","error":"model_not_found","message":{"id":"msg_limits_2","type":"message","role":"assistant","content":[{"type":"text","text":"There's an issue with the selected model (claude-old-1). It may not exist or you may not have access to it. Run /model to pick a different model."}]},"session_id":"limits-claude-1","parent_tool_use_id":null}'''
[[rule.step]]
emit = '''{"type":"result","subtype":"success","is_error":true,"api_error_status":404,"result":"There's an issue with the selected model (claude-old-1). It may not exist or you may not have access to it. Run /model to pick a different model.","session_id":"limits-claude-1","total_cost_usd":0.0,"usage":{"input_tokens":0,"output_tokens":0}}'''
[[rule.step]]
exit = 1
