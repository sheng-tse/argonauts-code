# The fake Codex runs out of room in its context window. A fresh Codex session gets the
# fallback note and finishes the task.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# A fresh session whose fallback note carries the stopped session's last message finishes it.
[[rule]]
argv0 = "codex"
args_contain = ["exec"]
stdin_prompt = "all"
prompt_contains = "LIMITS-PROGRESS-NOTE"
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/codex/fixtures/build_hello_resumed.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "codex"
args_contain = ["exec"]
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"limits-codex-1"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
write = { path = "notes.txt", content = "first half\n" }
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"LIMITS-PROGRESS-NOTE: notes.txt holds the first half."}}'
[[rule.step]]
emit = '''{"type":"error","message":"Codex ran out of room in the model's context window. Start a new thread or clear earlier history before retrying."}'''
[[rule.step]]
emit = '''{"type":"turn.failed","error":{"message":"Codex ran out of room in the model's context window. Start a new thread or clear earlier history before retrying."}}'''
[[rule.step]]
exit = 1
