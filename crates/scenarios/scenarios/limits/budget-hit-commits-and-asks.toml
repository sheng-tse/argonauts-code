# The fake Claude Code spends past the task's limit and stops. With more limit, the resumed
# session finishes the task.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# A resumed session finishes the task, for less than the half again that "More limit" adds.
[[rule]]
argv0 = "claude"
args_contain = ["-p", "--resume", "limits-claude-1"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits"}'
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"result":"Wrote hello.txt.","session_id":"limits-claude-1","total_cost_usd":0.01,"usage":{"input_tokens":1000,"output_tokens":100},"structured_output":{"status":"done","summary":"Wrote hello.txt.","files_changed":["hello.txt"],"tests_run":[],"concerns":[]}}'
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits","apiKeySource":"none"}'
[[rule.step]]
write = { path = "notes.txt", content = "first half\n" }
[[rule.step]]
emit = '{"type":"assistant","message":{"id":"msg_limits_1","type":"message","role":"assistant","model":"claude-haiku-4-5-20251001","content":[{"type":"text","text":"LIMITS-PROGRESS-NOTE: notes.txt holds the first half."}]},"session_id":"limits-claude-1","parent_tool_use_id":null}'
[[rule.step]]
emit = '{"type":"result","subtype":"error_max_budget_usd","is_error":true,"result":"","session_id":"limits-claude-1","total_cost_usd":0.06,"usage":{"input_tokens":4000,"output_tokens":900}}'
[[rule.step]]
exit = 1
