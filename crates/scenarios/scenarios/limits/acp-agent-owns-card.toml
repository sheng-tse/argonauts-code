# The fake agent installed as hermes speaks ACP and owns a solo card: it asks to write
# hello.txt inside its worktree, writes it, reports through the report tool, and ends its turn.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"
hermes = "hermes 0.21.5"

[[acp]]
argv0 = "hermes"
session_id = "limits-hermes-1"

[acp.reply."session/new"]
result = { models = { currentModelId = "fake-local", availableModels = [{ modelId = "fake-local", name = "Fake local model" }] } }

[acp.reply."session/set_model"]
result = {}

[[acp.turn]]
stop_reason = "end_turn"
result = { usage = { inputTokens = 900, outputTokens = 40 } }
[[acp.turn.step]]
update = { sessionUpdate = "agent_message_chunk", content = { type = "text", text = "Creating hello.txt." } }
[[acp.turn.step]]
update = { sessionUpdate = "tool_call", toolCallId = "t-write", title = "Write hello.txt", kind = "edit", status = "pending", locations = [{ path = "hello.txt" }] }
[[acp.turn.step]]
permission = { tool_call = { toolCallId = "t-write", title = "Write hello.txt", kind = "edit", locations = [{ path = "hello.txt" }] }, expect = "allow-once" }
[[acp.turn.step]]
write = { path = "hello.txt", content = "hi\n" }
[[acp.turn.step]]
update = { sessionUpdate = "tool_call_update", toolCallId = "t-write", status = "completed" }
[[acp.turn.step]]
report = { status = "done", summary = "Created hello.txt containing the word hi.", files_changed = ["hello.txt"], tests_run = [], concerns = [], questions = [], change_requests = [], memory_proposals = [] }
