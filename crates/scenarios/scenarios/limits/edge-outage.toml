# The fake Claude Code starts the work, then is overloaded: it retries twice, then gives up
# with a 529, the way the real one ends a session in an outage. Codex can take its task.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "codex"
args_contain = ["exec"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/codex/fixtures/0.158.0/build_hello.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits","apiKeySource":"none"}'
[[rule.step]]
write = { path = "notes.txt", content = "first half\n" }
[[rule.step]]
emit = '{"type":"system","subtype":"api_retry","attempt":1,"max_retries":2,"retry_delay_ms":500,"error_status":529,"error":"overloaded","session_id":"limits-claude-1","uuid":"limits-retry-1"}'
[[rule.step]]
sleep_ms = 500
[[rule.step]]
emit = '{"type":"system","subtype":"api_retry","attempt":2,"max_retries":2,"retry_delay_ms":1000,"error_status":529,"error":"overloaded","session_id":"limits-claude-1","uuid":"limits-retry-2"}'
[[rule.step]]
sleep_ms = 1000
[[rule.step]]
emit = '{"type":"result","subtype":"error_during_execution","is_error":true,"api_error_status":529,"result":"API Error: 529 Overloaded","session_id":"limits-claude-1","total_cost_usd":0.0,"usage":{"input_tokens":0,"output_tokens":0}}'
[[rule.step]]
exit = 1
