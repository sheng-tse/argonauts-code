# The fake Claude Code hits its usage limit, and you take the card over in its own UI.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# A resumed session finishes the card.
[[rule]]
argv0 = "claude"
args_contain = ["-p", "--resume", "limits-claude-1"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0

# Taking over opens Claude Code's own UI on the same session: you edit a file and quit.
[[rule]]
argv0 = "claude"
args_contain = ["--resume", "limits-claude-1"]
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"limits-claude-1","cwd":".","model":"claude-haiku-4-5-20251001","tools":["Read","Edit","Write","Bash"],"claude_code_version":"2.1.284","permissionMode":"acceptEdits","apiKeySource":"none"}'
[[rule.step]]
write = { path = "notes.txt", content = "first half\n" }
[[rule.step]]
emit = '{"type":"assistant","message":{"id":"msg_limits_1","type":"message","role":"assistant","model":"claude-haiku-4-5-20251001","content":[{"type":"text","text":"LIMITS-PROGRESS-NOTE: notes.txt holds the first half."}]},"session_id":"limits-claude-1","parent_tool_use_id":null}'
[[rule.step]]
emit = '{"type":"rate_limit_event","rate_limit_info":{"status":"rejected","resetsAt":@RESET_LATER@,"rateLimitType":"five_hour","utilization":1.0,"isUsingOverage":false},"session_id":"limits-claude-1"}'
[[rule.step]]
emit = '''{"type":"assistant","error":"rate_limit","message":{"id":"msg_limits_2","type":"message","role":"assistant","content":[{"type":"text","text":"You've hit your usage limit · resets 3:45pm"}]},"session_id":"limits-claude-1","parent_tool_use_id":null}'''
[[rule.step]]
emit = '''{"type":"result","subtype":"success","is_error":true,"result":"You've hit your usage limit · resets 3:45pm","session_id":"limits-claude-1","total_cost_usd":0.0,"usage":{"input_tokens":0,"output_tokens":0}}'''
[[rule.step]]
exit = 1
