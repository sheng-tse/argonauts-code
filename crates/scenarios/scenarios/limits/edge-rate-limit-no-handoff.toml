# The fake Claude Code is rate limited twice, retries as the real one does, and then finishes
# the task from the recorded build run. Nothing is handed off.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "claude"
args_contain = ["-p", "--permission-mode", "acceptEdits"]
[[rule.step]]
emit = '{"type":"system","subtype":"api_retry","attempt":1,"max_retries":10,"retry_delay_ms":1200,"error_status":429,"error":"rate_limit","session_id":"54794f0b-6a9d-4ca1-ac64-42dac771c423","uuid":"limits-retry-1"}'
[[rule.step]]
sleep_ms = 1200
[[rule.step]]
emit = '{"type":"system","subtype":"api_retry","attempt":2,"max_retries":10,"retry_delay_ms":2400,"error_status":429,"error":"rate_limit","session_id":"54794f0b-6a9d-4ca1-ac64-42dac771c423","uuid":"limits-retry-2"}'
[[rule.step]]
sleep_ms = 2400
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0
