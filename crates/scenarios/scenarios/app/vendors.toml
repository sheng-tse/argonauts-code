# The fake agent CLIs for the app scenarios. Requests are told apart by their text, the
# crew's steps by a property name of their output schema, and read-only sessions from
# building ones by Claude Code's permission mode. First match wins, so specific rules come
# first. Session rules name an argument only a session has (`exec`, `--output-format`),
# so `--version` falls through to the version table. The texts match
# `app_support::requests`.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# A resumed owner whose prompt carries the guidance sent while the run was parked.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits", "--resume"]
prompt_contains = 'use the name loadSettings'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-owner-slow","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-owner-slow","message":{"id":"msg-sess-owner-slow","content":[{"type":"text","text":"Renamed it to loadSettings."}]}}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-owner-slow","result":"Renamed it to loadSettings.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"status":"done","summary":"Renamed the loader to loadSettings.","files_changed":["loader-notes.md"],"tests_run":[],"concerns":[],"questions":[],"change_requests":[],"memory_proposals":[]}}'
[[rule.step]]
exit = 0

# Any other resumed owner finishes.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits", "--resume"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-owner-slow","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-owner-slow","message":{"id":"msg-sess-owner-slow","content":[{"type":"text","text":"Finished the rename."}]}}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-owner-slow","result":"Finished the rename.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"status":"done","summary":"Finished the rename.","files_changed":["loader-notes.md"],"tests_run":[],"concerns":[],"questions":[],"change_requests":[],"memory_proposals":[]}}'
[[rule.step]]
exit = 0

# An owner that works until it is stopped.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits"]
prompt_contains = 'rename the config loader everywhere'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-owner-slow","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
write = { path = "loader-notes.md", content = "loader renamed in progress\n" }
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-owner-slow","message":{"id":"msg-sess-owner-slow","content":[{"type":"text","text":"Renaming the config loader."}],"usage":{"input_tokens":1200,"output_tokens":300}}}'
[[rule.step]]
hang = true

# An owner that sits in a build until it is stopped, so a pause waits for its tool call.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits"]
prompt_contains = 'rename the config loader while the build runs'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-owner-building","cwd":".","tools":["Read","Grep","Glob","Bash"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-owner-building","message":{"id":"msg-building","content":[{"type":"tool_use","id":"toolu_build_1","name":"Bash","input":{"command":"cargo build"}}]}}'
[[rule.step]]
hang = true

# An owner that takes a few seconds, then reports.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits"]
prompt_contains = 'rename the settings reader in a few seconds'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-owner-timed","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-owner-timed","message":{"id":"msg-sess-owner-timed","content":[{"type":"text","text":"Renaming the settings reader."}]}}'
[[rule.step]]
write = { path = "reader-notes.md", content = "settings reader renamed\n" }
[[rule.step]]
sleep_ms = 3000
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-owner-timed","result":"Renamed the settings reader.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"status":"done","summary":"Renamed the settings reader.","files_changed":["reader-notes.md"],"tests_run":[],"concerns":[],"questions":[],"change_requests":[],"memory_proposals":[]}}'
[[rule.step]]
exit = 0

