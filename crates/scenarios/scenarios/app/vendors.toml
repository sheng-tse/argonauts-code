[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"kind\":\"answer\",\"answer_markdown\":\"Hi from Codex.\",\"estimate\":null}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":12,"cached_input_tokens":0,"output_tokens":20,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0

