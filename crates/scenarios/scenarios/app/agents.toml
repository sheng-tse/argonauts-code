[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-planner-claude","result":"One task: the limiter itself.","total_cost_usd":0.001,"usage":{"input_tokens":100,"output_tokens":60},"structured_output":{"summary":"One task: the limiter itself.","tasks":[{"title":"Add a token bucket per API key","done_when":["a key over its limit gets 429 with Retry-After"]}]}}'
[[rule.step]]
exit = 0

