emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-worker-any","result":"Done.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"status":"done","summary":"Done.","files_changed":[],"tests_run":[],"concerns":[],"questions":[],"change_requests":[],"memory_proposals":[]}}'
[[rule.step]]
