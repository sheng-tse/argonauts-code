[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-worker-limiter","result":"Added the limiter.","total_cost_usd":0.001,"usage":{"input_tokens":900,"output_tokens":250},"structured_output":{"status":"done","summary":"A token bucket per API key, after the auth middleware.","files_changed":["rate-limit.md"],"tests_run":[],"concerns":[],"questions":[],"change_requests":[],"memory_proposals":[]}}'
[[rule.step]]
