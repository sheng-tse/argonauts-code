[[rule.step]]
emit = '{"type":"assistant","error":"rate_limit","parent_tool_use_id":null,"session_id":"sess-worker-limited","message":{"id":"msg-limit-worker-limited","content":[{"type":"text","text":"You\u0027ve hit your session limit · resets 3pm"}]}}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":true,"session_id":"sess-worker-limited","result":"You\u0027ve hit your session limit · resets 3pm","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20}}'
[[rule.step]]
