# The run review, which proposes no change. Its prompt quotes the request, so it comes before the
# conversation rules.
[[rule]]
argv0 = "claude"
prompt_contains = "the evolvable list"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-run-review","cwd":".","tools":[],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-run-review","result":"done","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"change":null}}'
