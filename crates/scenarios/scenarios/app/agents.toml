# Logged in.
[[rule]]
argv0 = "codex"
args_contain = ["login", "status"]
[[rule.step]]
emit = '"Logged in using ChatGPT"'
[[rule.step]]
exit = 0

# The export job falls back to Codex, which updates its callers.
[[rule]]
argv0 = "codex"
args_contain = ["exec"]
prompt_contains = 'move the export job onto the worker queue'
stdin_prompt = "all"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"thread-worker-limited-codex"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
write = { path = "export-callers.md", content = "the callers enqueue the export job\n" }
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"status\":\"done\",\"summary\":\"Updated the export job callers.\",\"files_changed\":[\"export-callers.md\"],\"tests_run\":[],\"concerns\":[],\"questions\":[],\"change_requests\":[],\"memory_proposals\":[]}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":12,"cached_input_tokens":0,"output_tokens":20,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0

# A drafting agent, still drafting. Codex shows its text only when the message is complete.
[[rule]]
argv0 = "codex"
args_contain = ["exec"]
prompt_contains = '"test_strategy"'
stdin_prompt = "all"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"thread-draft-codex"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
hang = true

[[rule]]
argv0 = "codex"
args_contain = ["exec"]
prompt_contains = '"differences"'
stdin_prompt = "all"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"thread-compare-codex"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"agreements\":[\"429 + Retry-After\",\"limits survive restarts\",\"under 5 ms p50 overhead\"],\"differences\":[{\"topic\":\"Retry-After units\",\"readings\":[{\"label\":\"A\",\"reading\":\"seconds\"},{\"label\":\"B\",\"reading\":\"seconds\"},{\"label\":\"C\",\"reading\":\"milliseconds\"}],\"tag\":\"detail\",\"question\":null},{\"topic\":\"limit per user or per API key\",\"readings\":[{\"label\":\"A\",\"reading\":\"per API key\"},{\"label\":\"B\",\"reading\":\"per API key\"},{\"label\":\"C\",\"reading\":\"per user\"}],\"tag\":\"scope\",\"question\":{\"text\":\"Limit per user, or per API key?\",\"options\":[\"Per API key\",\"Per user\"],\"recommended\":0,\"basis\":\"2 of 3 readings read it this way\"}}]}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":12,"cached_input_tokens":0,"output_tokens":20,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0

