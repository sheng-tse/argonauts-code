# Two files with no tests yet, so the small-change rule passes and the migration label
# picks crew.
[[rule]]
argv0 = "claude"
args_contain = ["dontAsk"]
prompt_contains = 'move sessions to the new storage backend'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-conversation-claude","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"assistant","parent_tool_use_id":null,"session_id":"sess-conversation-claude","message":{"id":"msg-sess-conversation-claude","content":[{"type":"text","text":"Move the session store behind the new backend."}]}}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-conversation-claude","result":"Move the session store behind the new backend.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"kind":"change","answer_markdown":"Move the session store behind the new backend.","estimate":{"task_type":"refactor","summary":"Move sessions to the new storage backend","files_likely":["src/sessions.ts","src/storage.ts"],"file_count":2,"risk_labels":["migration"],"tests_exist":false,"unknowns":[]}}}'
[[rule.step]]
exit = 0

