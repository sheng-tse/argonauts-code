args_contain = ["acceptEdits"]
prompt_contains = 'move the export job onto the worker queue'
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-worker-limited","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
write = { path = "export-job.md", content = "the export job runs on the worker queue\n" }
[[rule.step]]
