# The fake Claude Code owns a solo card: it writes hello.txt and plays the recorded build run.
# Any other Claude Code call gets the recorded read-only answer. The fake Codex, where a
# scenario makes it the reviewer, approves the card.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "claude"
args_contain = ["-p"]
stdin_prompt = "line"
prompt_contains = "hello.txt"
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/write.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p"]
stdin_prompt = "line"
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/2.1.284/read-only.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "codex"
args_contain = ["exec"]
stdin_prompt = "all"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"01a0ec49-6e10-7c90-868e-70bbd0cb3302"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"verdict\":\"approve\",\"summary\":\"hello.txt holds the word hi, as asked.\",\"comments\":[],\"tamper_suspected\":false}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":2000,"cached_input_tokens":0,"cache_write_input_tokens":0,"output_tokens":40,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0
