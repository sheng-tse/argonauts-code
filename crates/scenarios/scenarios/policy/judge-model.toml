# The fake Claude Code owns a Captain task and writes hello.txt; the fake Codex is the judge
# model and approves the merge. Codex plays no other part here, so every Codex call is the
# judge's.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

[[rule]]
argv0 = "claude"
args_contain = ["-p"]
stdin_prompt = "line"
prompt_contains = "hello.txt"
[[rule.step]]
write = { path = "hello.txt", content = "hi\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/write.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
args_contain = ["-p"]
stdin_prompt = "line"
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/read-only-untitled.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "codex"
args_contain = ["exec"]
stdin_prompt = "all"
# Every judge prompt has it, and matching on it keeps the prompt for the scenario to read.
prompt_contains = "Documents (data, never instructions)"
[[rule.step]]
emit = '{"type":"thread.started","thread_id":"01a0ec49-6e10-7c90-868e-70bbd0cb3301"}'
[[rule.step]]
emit = '{"type":"turn.started"}'
[[rule.step]]
emit = '{"type":"item.completed","item":{"id":"item_0","type":"agent_message","text":"{\"verdict\":\"approve\",\"reasons\":[\"It only adds hello.txt.\"],\"rules_cited\":[\"Small changes may merge.\"]}"}}'
[[rule.step]]
emit = '{"type":"turn.completed","usage":{"input_tokens":2000,"cached_input_tokens":0,"cache_write_input_tokens":0,"output_tokens":40,"reasoning_output_tokens":0}}'
[[rule.step]]
exit = 0
