# The four states a session shows at every capture width: a conversation answer, a run at work,
# its merge approval, and the finished run. The worker waits for the test's `busy-captured`
# signal before it edits, so the busy screen stays up until it is captured.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"

# Claude Code reads its prompt as one stream-json line, on a stdin that stays open.
[[rule]]
argv0 = "claude"
args_contain = ["acceptEdits"]
prompt_contains = "Fix the install command"
stdin_prompt = "line"
[[rule.step]]
await_signal = "busy-captured"
[[rule.step]]
write = { path = "README.md", content = "# acme-api\n\nInstall it with:\n\n    npm install @acme/api\n" }
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/write.stdout.jsonl"
[[rule.step]]
exit = 0

# The conversation turn reads the fix as a one-file change, so the rules run it as Captain.
[[rule]]
argv0 = "claude"
args_contain = ["dontAsk"]
prompt_contains = "Fix the install command"
stdin_prompt = "line"
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-conversation-fix","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-conversation-fix","result":"Fix the install command in README.md.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"kind":"change","answer_markdown":"Fix the install command in README.md.","estimate":{"task_type":"docs","summary":"Fix the README install command","files_likely":["README.md"],"file_count":1,"risk_labels":[],"tests_exist":true,"unknowns":[]}}}'
[[rule.step]]
exit = 0

# Any other conversation turn is answered.
[[rule]]
argv0 = "claude"
args_contain = ["dontAsk"]
[[rule.step]]
emit = '{"type":"system","subtype":"init","session_id":"sess-conversation-any","cwd":".","tools":["Read","Grep","Glob"],"model":"claude-haiku-4-5"}'
[[rule.step]]
emit = '{"type":"result","subtype":"success","is_error":false,"session_id":"sess-conversation-any","result":"Hi. Describe a change you want made.","total_cost_usd":0.001,"usage":{"input_tokens":12,"output_tokens":20},"structured_output":{"kind":"answer","answer_markdown":"Hi. Describe a change you want made.","estimate":null}}'
[[rule.step]]
exit = 0

[[rule]]
argv0 = "claude"
[[rule.step]]
emit_file = "../../../adapters/claude-code/fixtures/read-only-untitled.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "codex"
[[rule.step]]
emit_file = "../../../adapters/codex/fixtures/read_only_ok.stdout.jsonl"
[[rule.step]]
exit = 0

[[rule]]
argv0 = "agy"
[[rule.step]]
emit_file = "../../../adapters/antigravity-cli/fixtures/readonly_ok_plain.stdout.jsonl"
[[rule.step]]
exit = 0
