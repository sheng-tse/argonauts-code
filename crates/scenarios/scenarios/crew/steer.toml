# A solo task whose worker is in a long tool call when you steer it from the session view
# (`m`). Claude Code takes steering on its open input stream after the current tool call, so
# the worker waits on stdin for the steer right after the tool's result.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"


# triage
[[rule]]
argv0 = "claude"
prompt_contains = "IntakeReply"
[[rule.step]]
emit = "{\"type\":\"system\",\"subtype\":\"init\",\"session_id\":\"claude-triage\",\"model\":\"claude-haiku-4-5\",\"tools\":[],\"mcp_servers\":[]}"
[[rule.step]]
emit = "{\"type\":\"result\",\"subtype\":\"success\",\"is_error\":false,\"result\":\"done\",\"session_id\":\"claude-triage\",\"total_cost_usd\":0.01,\"usage\":{\"input_tokens\":120,\"output_tokens\":60},\"structured_output\":{\"kind\":\"change\",\"answer_markdown\":\"A change: per-key rate limiting touches the API middleware, a counter store, and tests.\",\"estimate\":{\"task_type\":\"api-feature\",\"summary\":\"Per-key rate limiting on the public API\",\"files_likely\":[\"src/api/rate-limit.ts\",\"src/limiter/index.ts\",\"src/limiter/store.ts\",\"tests/load/rate-limit.test.ts\",\"docs/rate-limits.md\"],\"file_count\":9,\"risk_labels\":[\"security\"],\"tests_exist\":true,\"unknowns\":[]}}}"
[[rule.step]]
exit = 0


