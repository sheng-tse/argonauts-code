# the worker's build session
[[rule]]
argv0 = "claude"
prompt_contains = "Add a Retry-After header to 429 responses"
stdin_prompt = "line"
[[rule.step]]
emit = "{\"type\":\"system\",\"subtype\":\"init\",\"session_id\":\"claude-owner\",\"model\":\"claude-haiku-4-5\",\"tools\":[\"Bash\",\"Read\",\"Edit\"],\"mcp_servers\":[{\"name\":\"argonauts\",\"status\":\"connected\"}]}"
[[rule.step]]
emit = "{\"type\":\"assistant\",\"session_id\":\"claude-owner\",\"parent_tool_use_id\":null,\"message\":{\"id\":\"msg-0024\",\"type\":\"message\",\"role\":\"assistant\",\"model\":\"claude-haiku-4-5\",\"content\":[{\"type\":\"text\",\"text\":\"Running the tests first.\"}],\"stop_reason\":null,\"usage\":{\"input_tokens\":50,\"output_tokens\":20}}}"
[[rule.step]]
emit = "{\"type\":\"assistant\",\"session_id\":\"claude-owner\",\"parent_tool_use_id\":null,\"message\":{\"id\":\"msg-toolu_01\",\"type\":\"message\",\"role\":\"assistant\",\"model\":\"claude-haiku-4-5\",\"content\":[{\"type\":\"tool_use\",\"id\":\"toolu_01\",\"name\":\"Bash\",\"input\":{\"command\":\"npm test\"}}],\"stop_reason\":null,\"usage\":{\"input_tokens\":50,\"output_tokens\":20}}}"
[[rule.step]]
sleep_ms = 4000
[[rule.step]]
emit = "{\"type\":\"user\",\"session_id\":\"claude-owner\",\"parent_tool_use_id\":null,\"message\":{\"role\":\"user\",\"content\":[{\"type\":\"tool_result\",\"tool_use_id\":\"toolu_01\",\"content\":\"12 passed\",\"is_error\":false}]}}"
[[rule.step]]
expect_stdin_contains = "Use a sliding window"
[[rule.step]]
write = { path = "src/api/retry-after.ts", content = "export function retryAfter(seconds: number): string {\n  return String(Math.ceil(seconds));\n}\n" }
[[rule.step]]
emit = "{\"type\":\"assistant\",\"session_id\":\"claude-owner\",\"parent_tool_use_id\":null,\"message\":{\"id\":\"msg-0030\",\"type\":\"message\",\"role\":\"assistant\",\"model\":\"claude-haiku-4-5\",\"content\":[{\"type\":\"text\",\"text\":\"Switching to a sliding window.\"}],\"stop_reason\":null,\"usage\":{\"input_tokens\":50,\"output_tokens\":20}}}"
[[rule.step]]
emit = "{\"type\":\"result\",\"subtype\":\"success\",\"is_error\":false,\"result\":\"done\",\"session_id\":\"claude-owner\",\"total_cost_usd\":0.01,\"usage\":{\"input_tokens\":120,\"output_tokens\":60},\"structured_output\":{\"status\":\"done\",\"summary\":\"Added Retry-After with a sliding window, as steered.\",\"files_changed\":[\"src/api/retry-after.ts\"],\"tests_run\":[],\"concerns\":[],\"questions\":[],\"change_requests\":[],\"memory_proposals\":[]}}"
[[rule.step]]
exit = 0


