# WORKFLOW 12's example: "add per-key rate limiting to the public API" with the default
# peer-crew preset and a crew of Claude Code, Codex, and agy. Triage picks crew; two of three
# restatements read the limit per API key, so the differs turn scope into the one goal question;
# three blind drafts disagree on where counters live, a critique round and a spike settle it for
# Redis, cross-judging picks plan 2, and five cards build, review, and merge.
#
# Every vendor answers every step kind, so routing may give any card to any of them. Claude Code
# and agy steps are told apart by the output schema on their command line, and Codex steps by
# their prompt's opening instruction, since Codex reads its schema from a file. Build rules match
# the card's task and write its file; review rules approve. Each acceptance test names the file
# it checks, so the scenario's gate fails it against the stubs and passes it once built.

[version]
claude = "2.1.284 (Claude Code)"
codex = "codex-cli 0.158.0"
agy = "1.2.13"


# the consultant, when asked
[[rule]]
argv0 = "claude"
prompt_contains = "You are the crew's consultant"
stdin_prompt = "line"
[[rule.step]]
emit = "{\"type\":\"system\",\"subtype\":\"init\",\"session_id\":\"claude-consultant\",\"model\":\"claude-haiku-4-5\",\"tools\":[],\"mcp_servers\":[]}"
[[rule.step]]
emit = "{\"type\":\"result\",\"subtype\":\"success\",\"is_error\":false,\"result\":\"Keep the counters in Redis; the goal needs them to survive restarts.\",\"session_id\":\"claude-consultant\",\"total_cost_usd\":0.01,\"usage\":{\"input_tokens\":120,\"output_tokens\":60},\"structured_output\":null}"
[[rule.step]]
exit = 0


