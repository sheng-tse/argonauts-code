# CodeRabbit's review settings. It comments on pull requests; it never writes their descriptions.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  # The pull request description is the author's own: no summary, walkthrough poem or diagrams added to it.
  high_level_summary: false
  # A summary an author asks for with @coderabbitai summary goes into the review comment, not the description.
  high_level_summary_in_walkthrough: true
  poem: false
  sequence_diagrams: false
  collapse_walkthrough: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Every push gets a review, however many came before it.
    auto_pause_after_reviewed_commits: 0
  # Recordings and the lock file are checked by tests and tools; reviewing them line by line adds
  # noise. Screens are reviewed: the drawings in approved/ set the look, and a changed snapshot or
  # golden grid is a changed screen. Only the goldens' colour pages stay out, as they are large and
  # compared colour for colour by tests.
  path_filters:
    - "!**/fixtures/**"
    - "!**/tests/data/**"
    - "!**/golden/**/*.html"
    - "!assets/**"
    - "!Cargo.lock"
  path_instructions:
    - path: "approved/**"
      instructions: >-
        These drawings are the approved look of each screen, and tests compare the app with them, so a change
        here changes what counts as right. Flag a changed or added drawing whose row in approved/MANIFEST.toml
        isn't updated with its new hash and the approval it cites, and a drawing changed alongside the code it
        checks when the description doesn't say the new look was approved in an issue.
    - path: "**/*.snap"
      instructions: >-
        A snapshot records what the code drew, so a change here is a change on screen. Check that the description
        says it was meant, and that the new screen matches its drawing in approved/ where there is one. Flag a
        snapshot updated only to make a test pass.
    - path: "**/golden/**"
      instructions: >-
        A golden picture records what the code drew, so a change here is a change on screen. Check that the
        description says it was meant, and that it matches the screen's drawing in approved/ where there is one.
        Flag a picture updated only to make a test pass.
    - path: "crates/**/*.rs"
      instructions: >-
        Look for correctness, safety (the sandbox, approvals, the never-list and writes outside the project) and
        tests that would fail without the change. Comments should say why, not what. No test may call a model or
        touch the real ~/.argonauts.
    - path: "**/*.md"
      instructions: >-
        Public Markdown keeps each paragraph and list item on one line. Claims about the app must match the code.
    - path: ".github/workflows/**"
      instructions: >-
        Actions stay pinned to a commit SHA, permissions stay minimal, and secrets never reach pull requests from
        forks.
